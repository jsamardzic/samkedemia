  <script>
    // ---------- fractions ----------
    const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
    function Q(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
    const toQ = v => typeof v === 'number' ? Q(v) : v;
    const qadd = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d);
    const qmul = (a, b) => Q(a.n * b.n, a.d * b.d);
    const qneg = a => Q(-a.n, a.d);
    const qinv = a => Q(a.d, a.n);
    const qnum = a => a.n / a.d;
    const qkey = a => a.n + '/' + a.d;
    const qis = (a, n, d = 1) => a.n === n && a.d === d;
    const qabs = a => Q(Math.abs(a.n), a.d);
    const qtexPos = a => a.d === 1 ? String(a.n) : `\\frac{${a.n}}{${a.d}}`;
    const qtex = a => (a.n < 0 ? '-' : '') + qtexPos(qabs(a));
    const qexp = a => a.d === 1 ? String(a.n) : a.n + '/' + a.d;

    // ---------- expression nodes ----------
    // poly: sum of c·x^e (e rational) | add | mul (c·Πf) | div | pow (non-monomial base) | exp | ln
    function addTerm(m, c, e) { const k = qkey(e), o = m.get(k), nc = o ? qadd(o.c, c) : c; if (nc.n === 0) m.delete(k); else m.set(k, { e, c: nc }); }
    function P(list) { const m = new Map(); for (const [c, e] of list) addTerm(m, toQ(c), toQ(e)); return { t: 'poly', m }; }
    const terms = p => [...p.m.values()].sort((a, b) => qnum(b.e) - qnum(a.e));
    function padd(p, q) { const m = new Map(p.m); for (const t of q.m.values()) addTerm(m, t.c, t.e); return { t: 'poly', m }; }
    function pmul(p, q) { const m = new Map(); for (const a of p.m.values()) for (const b of q.m.values()) addTerm(m, qmul(a.c, b.c), qadd(a.e, b.e)); return { t: 'poly', m }; }
    const pscale = (p, c) => pmul(p, P([[c, 0]]));
    const pderiv = p => P(terms(p).filter(t => t.e.n !== 0).map(t => [qmul(t.c, t.e), qadd(t.e, Q(-1))]));
    const C = c => P([[c, 0]]);
    const X = P([[1, 1]]);
    const isZero = n => n.t === 'poly' && n.m.size === 0;
    const constVal = n => n.t === 'poly' && [...n.m.values()].every(t => t.e.n === 0) ? (n.m.size ? [...n.m.values()][0].c : Q(0)) : null;
    const isMono = n => n.t === 'poly' && n.m.size === 1;
    const monoOf = n => [...n.m.values()][0];
    const isX = n => isMono(n) && qis(monoOf(n).e, 1) && qis(monoOf(n).c, 1);

    function key(n) {
        switch (n.t) {
            case 'poly': return 'P[' + terms(n).map(t => qkey(t.c) + 'x' + qkey(t.e)).join(',') + ']';
            case 'add': return 'A[' + n.a.map(key).join(',') + ']';
            case 'mul': return 'M' + qkey(n.c) + '[' + n.f.map(key).join(',') + ']';
            case 'div': return 'D[' + key(n.a) + ',' + key(n.b) + ']';
            case 'pow': return 'W' + qkey(n.n) + '[' + key(n.a) + ']';
            case 'exp': return 'E[' + key(n.a) + ']';
            case 'ln': return 'L[' + key(n.a) + ']';
        }
    }

    // raw constructors: build problems exactly as written, no simplification
    const RM = (...f) => ({ t: 'mul', c: Q(1), f });
    const RD = (a, b) => ({ t: 'div', a, b });
    const RP = (a, n) => ({ t: 'pow', a, n: toQ(n) });
    const RE = a => ({ t: 'exp', a });
    const RL = a => ({ t: 'ln', a });

    // simplifying constructors: used for every derivative
    function add(...xs) { return factorExp(addCore(xs, true)); }
    // pull out an e^(…) that every term shares: 2xe^x + x^2e^x → (x^2 + 2x)e^x
    function factorExp(r) {
        if (r.t !== 'add') return r;
        const parts = r.a.map(t => {
            const fs = t.t === 'exp' ? [t] : (t.t === 'mul' ? t.f : []), e = fs.find(f => f.t === 'exp');
            return e && { e, rest: t.t === 'exp' ? C(1) : mul(t.c, ...fs.filter(f => f !== e)) };
        });
        if (parts.some(p => !p) || parts.some(p => key(p.e) !== key(parts[0].e))) return r;
        return mul(addCore(parts.map(p => p.rest), true), parts[0].e);
    }
    function addCore(xs, tryDistribute) {
        const flat = [];
        const push = x => x.t === 'add' ? x.a.forEach(push) : flat.push(x);
        xs.forEach(push);
        const out = []; let poly = null;
        for (const t of flat) {
            if (t.t === 'poly') { if (isZero(t)) continue; if (!poly) { poly = t; out.push(null); } else poly = padd(poly, t); continue; }
            const c = t.t === 'mul' ? t.c : Q(1);
            const b = t.t === 'mul' ? (t.f.length === 1 ? t.f[0] : { t: 'mul', c: Q(1), f: t.f }) : t;
            const k = key(b), o = out.find(o => o && o.k === k);
            if (o) o.c = qadd(o.c, c); else out.push({ k, c, b });
        }
        const res = out.map(o => o === null ? poly : (o.c.n === 0 ? C(0) : mul(o.c, o.b))).filter(t => !isZero(t));
        const r1 = res.length === 0 ? C(0) : (res.length === 1 ? res[0] : { t: 'add', a: res });
        if (!tryDistribute) return r1;
        // multiplying out (x+1)e^x − e^x lets like terms cancel; keep it only when it gives fewer terms
        const spread = flat.flatMap(t => {
            if (t.t !== 'mul') return [t];
            const i = t.f.findIndex(f => f.t === 'poly' && f.m.size > 1);
            if (i < 0) return [t];
            const rest = t.f.filter((_, j) => j !== i);
            return terms(t.f[i]).map(m => mul(t.c, P([[m.c, m.e]]), ...rest));
        });
        if (spread.length === flat.length) return r1;
        const r2 = addCore(spread, false);
        const count = r => r.t === 'add' ? r.a.length : 1;
        return count(r2) < count(r1) || (count(r2) === count(r1) && tex(r2).length < tex(r1).length) ? r2 : r1;
    }
    const RANK = { poly: 1, add: 1, pow: 2, exp: 3, ln: 4 };
    function mul(...xs) {
        let c = Q(1); const f = [];
        const push = x => {
            if (!x.t) { c = qmul(c, toQ(x)); return; }
            if (x.t === 'mul') { c = qmul(c, x.c); x.f.forEach(push); return; }
            const cv = constVal(x);
            if (cv) { c = qmul(c, cv); return; }
            f.push(x);
        };
        xs.forEach(push);
        if (c.n === 0) return C(0);
        const di = f.findIndex(x => x.t === 'div');
        if (di >= 0) { const d = f[di]; return div(mul(c, ...f.filter((_, j) => j !== di), d.a), d.b); }
        const polys = f.filter(x => x.t === 'poly'), others = f.filter(x => x.t !== 'poly');
        if (!others.length) return pscale(polys.reduce(pmul, C(1)), c);
        let mono = null; const multi = [];
        for (const p of polys) { if (isMono(p)) mono = mono ? pmul(mono, p) : p; else multi.push(p); }
        if (mono) { const t = monoOf(mono); c = qmul(c, t.c); mono = t.e.n === 0 ? null : P([[1, t.e]]); }

    const WORDS = ['sqrt', 'exp', 'ln', 'log', 'pi', 'e', 'x'];
    function tokenize(s) {
        s = s.toLowerCase().replace(/\*\*/g, '^').replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/÷/g, '/')
             .replace(/²/g, '^2').replace(/³/g, '^3').replace(/ˣ/g, '^x').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/[\[{]/g, '(').replace(/[\]}]/g, ')').replace(/,/g, '.');
        const out = []; let i = 0;
        while (i < s.length) {
            const ch = s[i];
            if (/\s/.test(ch)) { i++; continue; }
            const num = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
            if (num) { out.push({ k: 'num', v: num[1] }); i += num[1].length; continue; }
            if ('+-*/^()'.includes(ch)) { out.push({ k: ch }); i++; continue; }
            if (/[a-z]/.test(ch)) {
                const w = WORDS.find(w => s.startsWith(w, i));
                if (!w) throw new Error(`I don't know "${ch}". Use x, e, ln, sqrt.`);
                out.push(['e', 'x', 'pi'].includes(w) ? { k: 'sym', v: w } : { k: 'fn', v: w === 'log' ? 'ln' : w });
                i += w.length; continue;
            }
            throw new Error(`Unexpected "${ch}".`);
        }
        return out;
    }
    function parse(s) {
        const T = tokenize(s); let i = 0;
        if (!T.length) throw new Error('empty');
        const peek = () => T[i], eat = k => { if (!T[i] || T[i].k !== k) throw new Error(k === ')' ? 'A bracket is not closed.' : 'Something is missing.'); return T[i++]; };
        const starts = t => t && (t.k === 'num' || t.k === 'sym' || t.k === 'fn' || t.k === '(');
        function expr() {
            let a = term();
            while (peek() && (peek().k === '+' || peek().k === '-')) { const op = T[i++].k; a = { k: 'bin', op, a, b: term() }; }
            return a;
        }
        function term() {
            let a = unary();
            for (;;) {
                const t = peek();
                if (t && (t.k === '*' || t.k === '/')) { i++; a = { k: 'bin', op: t.k, a, b: unary() }; }
                else if (starts(t)) a = { k: 'bin', op: '*', a, b: power(), imp: true };
                else return a;
            }
        }
        function unary() {
            if (peek() && peek().k === '-') { i++; return { k: 'neg', a: unary() }; }
            if (peek() && peek().k === '+') { i++; return unary(); }
            return power();
        }
        function power() {
            const a = atom();
            if (peek() && peek().k === '^') { i++; return { k: 'bin', op: '^', a, b: unary() }; }
            return a;
        }
        function atom() {
            const t = T[i++];
            if (!t) throw new Error('Something is missing at the end.');
            if (t.k === 'num') return { k: 'num', v: parseFloat(t.v), s: t.v };
            if (t.k === 'sym') return { k: t.v };
            if (t.k === '(') { const a = expr(); eat(')'); return { k: 'par', a }; }
            if (t.k === 'fn') {
                if (peek() && peek().k === '(') { i++; const a = expr(); eat(')'); return { k: 'fn', f: t.v, a }; }
                if (!starts(peek())) throw new Error(`${t.v} needs something after it, like ${t.v}(x).`);
                return { k: 'fn', f: t.v, a: power() };
            }
            throw new Error(`Unexpected "${t.k}".`);
        }
        const r = expr();
        if (i < T.length) throw new Error(T[i].k === ')' ? 'There is an extra closing bracket.' : `Unexpected "${T[i].k}".`);
        return r;
    }
    function aev(n, x) {
        switch (n.k) {
            case 'num': return n.v;
            case 'x': return x;
            case 'e': return Math.E;
            case 'pi': return Math.PI;
            case 'par': return aev(n.a, x);
            case 'neg': return -aev(n.a, x);
            case 'fn': { const v = aev(n.a, x); return n.f === 'ln' ? Math.log(v) : n.f === 'sqrt' ? Math.sqrt(v) : Math.exp(v); }
            case 'bin': { const a = aev(n.a, x), b = aev(n.b, x);
                return n.op === '+' ? a + b : n.op === '-' ? a - b : n.op === '*' ? a * b : n.op === '/' ? a / b : Math.pow(a, b); }
        }
    }
    const strip = n => n.k === 'par' ? strip(n.a) : n;
    function atex(n) {
        switch (n.k) {
            case 'num': return n.s;
            case 'x': return 'x';
            case 'e': return 'e';
            case 'pi': return '\\pi';
            case 'par': return paren(atex(n.a));
            case 'neg': return '-' + atex(n.a);
            case 'fn': { const a = strip(n.a);
                if (n.f === 'sqrt') return '\\sqrt{' + atex(a) + '}';
                if (n.f === 'exp') return 'e^{' + atex(a) + '}';
                return '\\ln' + (a.k === 'x' ? ' x' : paren(atex(a))); }
            case 'bin': {
                if (n.op === '/') return `\\frac{${atex(strip(n.a))}}{${atex(strip(n.b))}}`;
                if (n.op === '^') { const b = n.a.k === 'fn' && n.a.f !== 'sqrt' ? paren(atex(n.a)) : atex(n.a); return b + '^{' + atex(strip(n.b)) + '}'; }
                if (n.op === '*') { const r = atex(n.b); return atex(n.a) + (n.imp && !/^[0-9.]/.test(r) ? '' : '\\cdot ') + r; }
                return atex(n.a) + ' ' + n.op + ' ' + atex(n.b);
            }
        }
    }

    // ---------- page ----------
    const $ = id => document.getElementById(id);
    const K = (s, el, display) => katex.render((display ? '\\displaystyle ' : '') + s, el, { throwOnError: false });
    const state = { rules: ['basic', 'product', 'quotient', 'chain'], level: 1, lastKey: null, cur: null, solved: false, counted: false, streak: 0, right: 0, total: 0 };
    try { const s = JSON.parse(localStorage.getItem('samkedemia-derivatives') || 'null'); if (s && s.rules && s.rules.length) { state.rules = s.rules.filter(r => GEN[r]); state.level = [1, 2, 3].includes(s.level) ? s.level : 1; } } catch (e) {}
    if (!state.rules.length) state.rules = ['basic'];
    const save = () => { try { localStorage.setItem('samkedemia-derivatives', JSON.stringify({ rules: state.rules, level: state.level })); } catch (e) {} };

    const TAGS = { basic: 'Power & sum', product: 'Product rule', quotient: 'Quotient rule', chain: 'Chain rule' };
    function newProblem() {
        state.cur = generate(); state.solved = false; state.counted = false;
        K('f(x) = ' + tex(state.cur.f), $('problem'), true);
        $('ruleTag').textContent = TAGS[state.cur.rule];
        $('answer').value = ''; $('answer').classList.remove('ok');
        $('feedback').className = 'feedback'; $('solution').className = 'solution'; $('solution').innerHTML = '';
        renderPreview();
        if (matchMedia('(hover: hover)').matches) $('answer').focus();
    }
    function renderPreview() {
        const el = $('preview'), s = $('answer').value.trim();
        if (!s) { el.className = 'preview empty'; el.textContent = 'Your answer appears here as you type.'; return; }
        try { const a = parse(s); el.className = 'preview'; K("f'(x) = " + atex(a), el, true); }
        catch (e) { el.className = 'preview err'; el.textContent = e.message === 'empty' ? '' : e.message; }
    }
    function score() {
        $('streak').textContent = state.streak; $('streak').classList.toggle('hot', state.streak >= 3);
        $('score').textContent = state.right + '/' + state.total;
    }
    function feedback(type, icon, html) { const el = $('feedback'); el.className = 'feedback show ' + type; el.innerHTML = `<i class="bi ${icon}"></i><span>${html}</span>`; }
    // equal to the true derivative at every test point where the true derivative exists
    function sameFunction(a, n) {
        let used = 0;
        for (const x of SAMPLES) {
            const want = ev(n, x); if (!isFinite(want)) continue;
            const got = aev(a, x); if (!isFinite(got)) return false;
            if (Math.abs(got - want) > 1e-6 * Math.max(1, Math.abs(want))) return false;
            used++;
        }
        return used >= 4;
    }
    function check() {
        if (state.solved) { newProblem(); return; }
        const s = $('answer').value.trim();
        if (!s) { $('answer').focus(); return; }
        let a; try { a = parse(s); } catch (e) { feedback('bad', 'bi-exclamation-circle', "I can't read that yet: " + e.message); return; }
        const firstTry = !state.counted;
        if (sameFunction(a, state.cur.d)) {
            state.solved = true; $('answer').classList.add('ok');
            if (firstTry) { state.counted = true; state.total++; state.right++; state.streak++; }
            feedback('ok', 'bi-check-circle-fill', '<b>Correct!</b> Press Enter or New problem for the next one.');
            score(); return;
        }
        if (firstTry) { state.counted = true; state.total++; state.streak = 0; score(); }
        const isF = sameFunction(a, state.cur.f);
        feedback('bad', 'bi-x-circle-fill', isF ? "That's f(x) itself. You still have to differentiate it."
            : 'Not quite. Check your work, or open the solution.');
    }
    function showSolution() {
        if (!state.counted) { state.counted = true; state.total++; state.streak = 0; score(); }
        const steps = solve(state.cur.f), el = $('solution');
        el.innerHTML = '<h3>Solution</h3>' + steps.map((s, i) => `<div class="step${s.final ? ' final' : ''}"><div class="n">${s.final ? '<i class="bi bi-check2"></i>' : i + 1}</div><div>
            <div class="t">${s.t}</div>${s.note ? `<div class="note">${s.note}</div>` : ''}${s.lines.map(l => `<div class="ml" data-l="${encodeURIComponent(l)}"></div>`).join('')}
            ${s.final ? '<div class="equiv">Your answer may look different: any equivalent form counts as correct.</div>' : ''}</div></div>`).join('');
        el.querySelectorAll('.ml').forEach(m => {
            const l = decodeURIComponent(m.dataset.l), w = /<span class="why">.*<\/span>$/.exec(l);
            const box = document.createElement('span'); K(w ? l.slice(0, w.index) : l, box, true); m.appendChild(box);
            if (w) m.insertAdjacentHTML('beforeend', w[0]);
        });
        el.className = 'solution show';
    }

    // controls
    function syncControls() {
        document.querySelectorAll('.rule-btn').forEach(b => b.classList.toggle('active', state.rules.includes(b.dataset.rule)));
        document.querySelectorAll('#level .segmented-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.level) === state.level));
    }
    document.querySelectorAll('.rule-btn').forEach(b => b.addEventListener('click', () => {
        const r = b.dataset.rule, on = state.rules.includes(r);
        if (on && state.rules.length === 1) return;
        state.rules = on ? state.rules.filter(x => x !== r) : [...state.rules, r];
        syncControls(); save(); newProblem();
    }));
    document.querySelectorAll('#level .segmented-btn').forEach(b => b.addEventListener('click', () => {
        state.level = Number(b.dataset.level); syncControls(); save(); newProblem();
    }));
    $('reset').addEventListener('click', () => { state.streak = state.right = state.total = 0; score(); });
    $('answer').addEventListener('input', () => { renderPreview(); if (!state.solved) $('feedback').className = 'feedback'; });
    $('answer').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
    $('check').addEventListener('click', check);
    $('show').addEventListener('click', showSolution);
    $('next').addEventListener('click', newProblem);
    document.querySelectorAll('.syntax [data-tex]').forEach(el => K(el.dataset.tex, el));
    K("f'(x) =", $('flabel'));
    syncControls(); score(); newProblem();
  </script>
</body>
</html>
