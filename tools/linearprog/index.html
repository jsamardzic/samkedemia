.shell { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 20px 56px; }
.brand-header { max-width: 800px; height: 68px; margin: 0 auto 38px; padding: 0 16px 0 30px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: linear-gradient(var(--glass-top), var(--glass-bottom)); border: 1.5px solid var(--glass-border); border-radius: 100px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .12); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 20; }
.brand-logo { display: flex; align-items: center; text-decoration: none; min-width: 0; }
.brand-logo img { height: 28px; width: auto; display: block; }
.logo-separator { width: 1px; height: 38px; background: var(--glass-border); margin: 0 18px; flex: none; }
.logo-page-title { font: 700 1.05rem/1 var(--font-body); color: var(--cream); white-space: nowrap; }
.header-socials { display: flex; gap: 10px; }
.social-icon { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .07); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; color: var(--cream); transition: transform .3s, background-color .3s, border-color .3s; }
.social-icon:hover { transform: translateY(-2px); background: var(--orange); border-color: var(--orange); }
.social-icon svg { width: 18px; height: 18px; }
@media (max-width: 650px) { .header-socials a:nth-child(n+2) { display: none; } }
@media (max-width: 520px) { .logo-page-title, .logo-separator { display: none; } .brand-header { padding-left: 22px; } }
.label { font: 700 .72rem/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase; color: var(--orange); }
.katex { font-size: 1.08em; }
button { font-family: inherit; }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ---- layout: two glass cards on the desk, the worked solution on paper underneath ---- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: 26px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.glass { min-width: 0; border-radius: 28px; padding: 24px; color: var(--cream); background: linear-gradient(var(--glass-top), var(--glass-bottom)); border: 1.5px solid var(--glass-border);
  box-shadow: 0 40px 80px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.glass .katex { color: var(--cream); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.card-top h2 { margin: 0; font: 900 1.35rem/1.15 var(--font-num); color: var(--cream); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#current-exercise-display { font: 700 .9rem/1 var(--font-body); color: var(--orange-light); }
.sec { margin: 22px 0 10px; }
.btn { appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 100px; cursor: pointer; white-space: nowrap;
  font: 700 .88rem/1 var(--font-body); color: var(--cream); background: rgba(255, 255, 255, .07); border: 1px solid var(--glass-border); transition: background-color .25s, border-color .25s, transform .15s; }
.btn:hover { background: var(--orange); border-color: var(--orange); }
.btn:active { transform: scale(.96); }
.btn i { font-size: 1rem; line-height: 1; }
.btn:focus-visible, .seg button:focus-visible, .pill:focus-visible, .exercise-item:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* inputs on glass */
.glass input[type="text"], .glass input[type="number"] { box-sizing: border-box; height: 38px; min-width: 0; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0, 0, 0, .28);
  color: var(--cream); font: 700 .95rem/1 var(--font-mono); text-align: center; padding: 0 8px; transition: border-color .2s, background-color .2s; }
.glass input:focus { outline: none; border-color: var(--orange); background: rgba(0, 0, 0, .4); }
.variables { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.variables label { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; color: var(--quiet); }
.variables input { width: 100%; }

/* constraints */
#constraints { display: grid; gap: 8px; }
.constraint { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .06); }
.constraint > span:nth-child(2) { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
.v { display: inline-flex; align-items: center; } .op { display: inline-flex; align-items: center; margin: 0 7px; }
#obj-fn-text-2, #obj-fn-text-3 { display: inline-flex; align-items: center; gap: 5px; }
.constraint-sign, .constraint-sign-disabled { margin: 0 6px; }
.constraint-number { flex: none; width: 28px; font: 700 .8rem/1 var(--font-mono); color: var(--quiet); }
.constraint .constraint-input { width: 70px; }
.constraint-sign, .constraint-sign-disabled { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; }
.constraint-sign { cursor: pointer; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, .08); color: var(--cream); transition: background-color .2s, border-color .2s; }
.constraint-sign:hover { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .4); }
.constraint-sign .katex, .constraint-sign-disabled .katex { color: var(--cream); font-size: 1.15em; }
.remove-btn { flex: none; width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--quiet); cursor: pointer; transition: color .2s, background-color .2s; }
.remove-btn:hover { color: #fff; background: rgba(255, 85, 0, .5); }
#addConstraintBtn { width: 100%; margin-top: 8px; height: 40px; border-radius: 14px; border: 1.5px dashed var(--glass-border); background: none; color: var(--quiet); cursor: pointer; font: 700 .88rem/1 var(--font-body); transition: border-color .2s, color .2s; }
#addConstraintBtn:hover { border-color: var(--orange); color: var(--orange-light); }
@keyframes fadeInSlideDown { from { opacity: 0; transform: translateY(-8px); } }

/* target function */
.target-function { display: flex; flex-direction: column; gap: 12px; }
.target-function-inputs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 5px; }
.target-function-inputs input { width: 64px; }
.seg { position: relative; display: inline-flex; padding: 4px; border-radius: 100px; background: rgba(0, 0, 0, .28); border: 1px solid var(--glass-border); align-self: flex-start; }
.seg button { appearance: none; border: 0; background: none; color: var(--quiet); font: 700 .86rem/1 var(--font-body); padding: 10px 18px; border-radius: 100px; cursor: pointer; transition: color .25s, background-color .25s; }
.seg button:hover { color: var(--cream); }
.seg button.active { background: var(--cream); color: var(--ground); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }

/* feasible region card */
.contour-row { display: flex; align-items: center; gap: 14px; margin: 16px 0 14px; }
.contour-row label { display: flex; align-items: center; gap: 8px; font: 700 .7rem/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--orange); white-space: nowrap; }
.contour-row input[type="number"] { width: 78px; }
.level-slider { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 6px; background: transparent; }
.level-slider::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--orange) var(--progress, 50%), rgba(255, 255, 255, .18) var(--progress, 50%)); }
.level-slider::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--orange) var(--progress, 50%), rgba(255, 255, 255, .18) var(--progress, 50%)); }
.level-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--orange); border: 3px solid var(--cream); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
.level-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--orange); border: 3px solid var(--cream); cursor: pointer; }
.solution-summary-card { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.summary-item { padding: 12px 14px; border-radius: 14px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .06); min-width: 0; }
.summary-item .label { font: 700 .66rem/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
.summary-item .value { font: 900 1.05rem/1.2 var(--font-num); color: var(--cream); overflow-wrap: anywhere; }
.goal-toggle { position: relative; appearance: none; text-align: left; font: inherit; cursor: pointer; transition: background-color .2s, border-color .2s; }
.goal-toggle:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .3); }
.goal-toggle .bi { position: absolute; top: 10px; right: 12px; font-size: .85rem; color: var(--orange); }
.chart-container { position: relative; display: flex; flex-direction: column; height: 510px; border-radius: 18px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .06); padding: 12px 12px 6px; box-sizing: border-box; }
.chart-controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin: 2px 2px 8px; }
.chart-canvas-wrap { position: relative; flex: 1; min-height: 0; }
.chart-toggles { display: flex; gap: 6px; }
.pill, .chart-toggle-btn, #resetZoomBtn { appearance: none; height: 30px; padding: 0 12px; border-radius: 100px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, .07); color: var(--quiet); font: 700 .78rem/1 var(--font-body); cursor: pointer; transition: background-color .2s, color .2s, border-color .2s; }
.chart-toggle-btn.active { background: var(--cream); border-color: var(--cream); color: var(--ground); }
#resetZoomBtn:hover, .chart-toggle-btn:hover { border-color: rgba(255, 255, 255, .45); color: var(--cream); }
.chart-toggle-btn.active:hover { color: var(--ground); }
@media (max-width: 600px) {
  .glass { padding: 18px 14px; border-radius: 22px; }
  .constraint { gap: 4px; padding: 6px 6px 6px 8px; } .constraint > span:nth-child(2) { gap: 3px; flex-wrap: nowrap; }
  .constraint-number { width: 22px; font-size: .72rem; }
  .constraint .constraint-input { width: 46px; padding: 0 2px; font-size: .85rem; }
  .constraint-sign, .constraint-sign-disabled { width: 30px; height: 34px; } .glass input[type="number"] { height: 34px; }
  .remove-btn { width: 26px; }
  .target-function-inputs input { width: 50px; }
  .constraint span input:last-of-type { width: 60px; }
  .op { margin: 0 3px; } .target-function-inputs input { width: 44px; } .goal-toggle .bi { top: 8px; right: 8px; font-size: .75rem; }
  .summary-item { padding: 10px; } .summary-item .label { font-size: .56rem; letter-spacing: .1em; } .summary-item .value { font-size: .9rem; }
}
@media (max-width: 600px) { .chart-container { height: 440px; } .chart-controls { justify-content: flex-start; gap: 5px; flex-wrap: nowrap; } .chart-toggles { gap: 5px; } .chart-toggle-btn, #resetZoomBtn { height: 28px; padding: 0 9px; font-size: .72rem; white-space: nowrap; } .variables { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .variables label:last-child { grid-column: 1 / -1; } }

/* ---- the worked solution, on paper ---- */
.sheet { margin-top: 26px; border-radius: 24px; padding: 26px 30px 30px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 70px rgba(0, 0, 0, .35); }
.sheet .card-top h2 { color: var(--ink); cursor: pointer; user-select: none; }
.sheet .card-top h2 i { font-size: 1rem; color: var(--ink-mid); transition: transform .3s; }
.sheet.collapsed .card-top h2 i { transform: rotate(-90deg); }
.sheet.collapsed #inequalities-breakdown { display: none; }
.sheet .btn { color: var(--ink); background: #fff; border-color: #cfdadb; }
.sheet .btn:hover { color: #fff; background: var(--orange); border-color: var(--orange); }
#inequalities-breakdown { margin-top: 10px; }
.step { padding: 24px 0 4px; }
.step + .step { border-top: 1px solid rgba(12, 56, 64, .08); }
.step-heading { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; font: 900 1.15rem/1.2 var(--font-num); color: var(--ink); }
.step-num-badge { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--orange); color: #fff; font: 900 .85rem/1 var(--font-num); }
.step-subtitle { margin: 0 0 14px 40px; color: #45656b; font-size: .95rem; line-height: 1.5; max-width: 72ch; }
.step-body { margin-left: 40px; }
@media (max-width: 600px) { .sheet { padding: 20px 16px 22px; } .step-subtitle, .step-body { margin-left: 0; } }
.var-display { display: flex; gap: 8px; }
.var-chip { display: inline-grid; place-items: center; min-width: 44px; height: 38px; padding: 0 12px; border-radius: 10px; background: #eff3f3; font-size: 1.05rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.icard { padding: 14px 16px; border-radius: 16px; background: #eff3f3; min-width: 0; }
.icard-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid rgba(12, 56, 64, .1); font-size: 1.05rem; }
.icard-h .n { font: 700 .8rem/1 var(--font-mono); color: #8da1a5; }
.rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; align-items: baseline; }
.icard .rows { padding-top: 6px; }
.rl { font: 700 .66rem/1.6 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: #8da1a5; white-space: nowrap; }
.rc { min-width: 0; font-size: .95rem; color: #24434a; overflow-x: auto; overflow-y: hidden; }
.rc .sub { display: block; margin-top: 4px; color: #6b8186; font-size: .88rem; }
.ok { color: #1f8a5b; font-weight: 700; white-space: nowrap; } .no { color: #c0392b; font-weight: 700; white-space: nowrap; }
.callout { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: #fff3ec; color: #5b3a28; font-size: .95rem; line-height: 1.5; }
.callout strong { color: var(--orange-ink); }
.answer { display: inline-flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--cream); font-size: 1rem; }
.answer .katex { color: var(--cream); }
.plot { position: relative; height: 380px; max-width: 600px; margin: 4px auto 0; padding: 10px; box-sizing: border-box; border-radius: 16px; background: #fff; border: 1px solid #e3eaeb; }

/* ---- exercise picker ---- */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(5, 22, 25, .6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.modal-content { width: min(720px, 100%); max-height: 86vh; display: flex; flex-direction: column; border-radius: 26px; padding: 22px 24px; color: var(--cream);
  background: linear-gradient(160deg, rgba(26, 96, 108, .9), rgba(5, 22, 25, .95)); border: 1.5px solid var(--glass-border); box-shadow: 0 30px 70px rgba(0, 0, 0, .55); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.modal-header h2 { margin: 0; font: 900 1.3rem/1.1 var(--font-num); }
.close-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, .07); color: var(--cream); cursor: pointer; }
.close-btn:hover { background: var(--orange); border-color: var(--orange); }
.modal-body { overflow-y: auto; padding-right: 4px; }
.exercise-group h4 { margin: 18px 0 10px; font: 700 .7rem/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
.exercise-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .exercise-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .exercise-list { grid-template-columns: minmax(0, 1fr); } }
.exercise-item { padding: 11px 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, .06); color: var(--cream); font: 700 .88rem/1.2 var(--font-body); text-align: left; cursor: pointer; transition: background-color .2s, border-color .2s; }
.exercise-item:hover { background: var(--orange); border-color: var(--orange); }
.exercise-loading { color: var(--quiet); }

.print-header { display: none; }

@media print {
  @page { size: A4; margin: 14mm 15mm; }
  :root { color-scheme: light; }
  html, body { background: #fff !important; background-image: none !important; }
  body::before, body::after, .brand-header, .layout, .modal-backdrop, #exportPdfBtn, .sheet .card-top h2 i { display: none !important; }
  .shell { padding: 0; max-width: none; }
  .print-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 2px solid #ff5500; }
  .print-header h1 { margin: 0; font: 900 18px/1.1 var(--font-num); color: #0c3840; }
  .print-header p { margin: 3px 0 0; font-size: 10px; color: #6b8186; }
  .print-header img { height: 18px; }
  .sheet { margin: 0; padding: 0; box-shadow: none; border-radius: 0; background: #fff; }
  .sheet .card-top { display: none; }
  .sheet.collapsed #inequalities-breakdown { display: block; }
  .step { padding: 12px 0 2px; } .step-heading, .step-subtitle { break-after: avoid; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .icard { padding: 10px 12px; } .rc { font-size: .85rem; } .step-subtitle { font-size: .85rem; margin-bottom: 8px; }
  .plot { break-inside: avoid; } .step:last-child, .step:nth-child(4), .step:nth-child(5) { break-inside: avoid; }
  .icard, .callout, .answer, .step-num-badge, .var-chip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .icard { break-inside: avoid; }
  .plot { height: 250px; max-width: 420px; border: 1px solid #e3eaeb; }
}

  <main class="layout">
    <section class="glass" aria-label="Setup">
      <div class="card-top">
        <h2>Setup <span id="current-exercise-display"></span></h2>
        <button id="exercisesBtn" class="btn"><i class="bi bi-folder2-open"></i>Load question</button>
      </div>

      <div class="label sec">Variables</div>
      <div class="variables">
        <label>Variable 1<input type="text" id="var1" value="q_1"></label>
        <label>Variable 2<input type="text" id="var2" value="q_2"></label>
        <label>Target function<input type="text" id="obj-fn-name" value="T"></label>
      </div>

      <div class="label sec">Constraints</div>
      <div id="constraints"></div>
      <button id="addConstraintBtn"><i class="bi bi-plus-lg"></i> Add constraint</button>

      <div class="label sec">Target function</div>
      <div class="target-function">
        <div class="target-function-inputs">
          <span id="obj-fn-text-1">T(q<sub>1</sub>, q<sub>2</sub>) = </span>
          <input type="number" id="obj-a" class="constraint-input" value="4">
          <span id="obj-fn-text-2"> &middot; q<sub>1</sub> + </span>
          <input type="number" id="obj-b" class="constraint-input" value="1">
          <span id="obj-fn-text-3"> &middot; q<sub>2</sub> + </span>
          <input type="number" id="obj-c" class="constraint-input" value="0">
        </div>
        <div id="optimization-mode-toggle" class="seg segmented-control" hidden>
          <button class="segmented-btn active" data-mode="maximize">Maximize</button>
          <button class="segmented-btn" data-mode="minimize">Minimize</button>
        </div>
      </div>
    </section>

    <section class="glass" id="step3" style="display: none;" aria-label="Feasible region">
      <div class="card-top"><h2>Feasible region</h2></div>
      <div class="contour-controls">
        <div class="contour-row">
          <input type="range" id="level-slider" class="level-slider" min="0" max="100" value="50" aria-label="Contour level">
          <label for="level-value">Level <input type="number" id="level-value" value="50"></label>
        </div>
      </div>
      <div id="solution-summary-card" class="solution-summary-card" style="display: none;"></div>
      <div class="chart-container">
        <div class="chart-controls">
          <div id="chart-toggles" class="chart-toggles">
            <button class="chart-toggle-btn" data-target="contour">Contour</button>
            <button class="chart-toggle-btn active" data-target="boundaries">Lines</button>
            <button class="chart-toggle-btn active" data-target="vertices">Vertices</button>
          </div>
          <button id="resetZoomBtn" style="display: none;">Reset zoom</button>
        </div>
        <div class="chart-canvas-wrap"><canvas id="feasibleRegionChart"></canvas></div>
      </div>
    </section>
  </main>

  <section class="sheet collapsed" id="step2" style="display: none;">
    <div class="card-top">
      <h2 id="step2-header">Step-by-step solution <i class="bi bi-chevron-down"></i></h2>
      <button id="exportPdfBtn" class="btn"><i class="bi bi-download"></i> Save as PDF</button>
    </div>
    <div id="inequalities-breakdown"></div>
  </section>

  <div id="exercises-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content" role="dialog" aria-label="Load a question">
      <div class="modal-header">
        <h2>Load a question</h2>
        <button id="close-modal-btn" class="close-btn" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="modal-body">
        <div id="exercise-groups"><p class="exercise-loading">Loading questions…</p></div>
      </div>
    </div>
  </div>
</div>

    // --- Modal Logic ---
    // the picker is built from linearprog-exercises.json: one section per group, in file order
    let exerciseData = null;

    async function buildExercisePicker() {

    function formatNumber(num) {
      if (typeof num !== 'number') {
        return num;
      }
      // Check if the number is very close to an integer
      if (Math.abs(num - Math.round(num)) < 1e-9) {
        return Math.round(num).toString();
      }
      // Otherwise, format to 2 decimal places
      return num.toFixed(2);
    }

    function toSubscript(text) {
        if (!text) return '';
        // Converts q_A to qₐ, q_1 to q₁, etc.
        return text.replace(/_([A-Za-z0-9]+)/g, (match, p1) => {
            return p1.split('').map(char => {
                const subscriptMap = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉', 'A': 'ₐ', 'B': 'ₑ', 'I': 'ᵢ' }; // Add more as needed
                return subscriptMap[char] || char;
            }).join('');
        });
    }

    let constraintsList = [];
    let feasibleRegionChart;
    let staticFeasibleRegionChart;
    let step6Chart;

    // Shared vertex-label drawing used by all three feasible-region charts.
    // Labels are pushed radially outward from the polygon's pixel centroid so
    // they land in open space next to a vertex instead of sitting on top of
    // whichever boundary line happens to pass through that point.
    //
    // The optimal-vertex indices are read off the chart instance itself
    // (chart.$optimalVertexIndices) rather than passed in as a closure
    // argument. Charts that get updated in place (chart.data.datasets = ...;
    // chart.update()) keep their *original* plugins array — the afterDraw
    // closure from whenever the chart was first created never changes — so a
    // captured variable goes stale and silently keeps coloring whichever
    // vertex was optimal on the very first render. Reading a property off
    // the chart avoids that: it's whatever was set most recently.
    function drawVertexLabels(chart) {
      const optimalIndices = chart.$optimalVertexIndices || [];
      const ctx = chart.ctx;
      const dsIdx = chart.data.datasets.findIndex(d => d.label === 'Feasible Vertices');
      if (dsIdx === -1) return;
      const meta = chart.getDatasetMeta(dsIdx);
      if (!meta || !meta.data || !meta.data.length) return;

      const cx = meta.data.reduce((sum, p) => sum + p.x, 0) / meta.data.length;
      const cy = meta.data.reduce((sum, p) => sum + p.y, 0) / meta.data.length;
      const offset = 18;

      ctx.save();
      ctx.font = '700 15px "Atkinson Hyperlegible", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // each label starts just outside its vertex, pointing away from the centre of the region
      const pos = meta.data.map(el => {
        let dx = el.x - cx, dy = el.y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        return { x: el.x + dx / dist * offset, y: el.y + dy / dist * offset };
      });
      // vertices close together (e.g. C and D in Question 32) would print on top of each other: push those labels apart
      const minGap = 20;
      for (let round = 0; round < 12; round++) {
        let moved = false;
        for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
          let dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y, d = Math.hypot(dx, dy);
          if (d >= minGap) continue;
          if (d < 0.01) { dx = 0; dy = 1; d = 1; }
          const push = (minGap - d) / 2;
          pos[i].x -= dx / d * push; pos[i].y -= dy / d * push;
          pos[j].x += dx / d * push; pos[j].y += dy / d * push;
          moved = true;
        }
        if (!moved) break;
      }

      meta.data.forEach((el, index) => {
        ctx.fillStyle = optimalIndices.includes(index) ? '#ff5500' : (chart.$dark ? '#f8f8f2' : '#2f6a73');
        ctx.fillText(String.fromCharCode(65 + index), pos[index].x, pos[index].y);
      });
      ctx.restore();
    }

    // Chart.js always draws a scale title rotated to run parallel to its axis,
    // so the y-axis label comes out sideways by default. Each chart disables
    // that built-in title (scales.y.title.display = false) and this draws the
    // variable name horizontally at the top-left of the plot area instead.
    // Chart.js adds the zoom edges as ticks (-2.5, 27.5); drop them when they're off the regular step
    function dropUnevenEdgeTicks(axis) {
      const t = axis.ticks; if (t.length < 4) return;
      const step = t[2].value - t[1].value, off = v => Math.abs(v / step - Math.round(v / step)) > 1e-6;
      axis.ticks = t.filter((tk, i) => !((i === 0 || i === t.length - 1) && off(tk.value)));
    }

    function drawYAxisLabel(chart) {
      const text = toSubscript(var2Input.value);
      if (!text) return;
      const ctx = chart.ctx;
      const y = (chart.chartArea.top + chart.chartArea.bottom) / 2;
      ctx.save();
      ctx.font = 'italic 500 15px "STIX Two Text", serif';
      ctx.fillStyle = chart.$dark ? '#f8f8f2' : '#0c3840';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 16, y);
      ctx.restore();
    }

    function formatVar(name) {
      name = name.trim();
      if (name.includes("_")) {
        const parts = name.split("_");
        return parts[0] + "<sub>" + parts[1] + "</sub>";
      }
      return name;
    }

    // Renders a LaTeX string to HTML via KaTeX, inline in the flow of text.
    function M(tex) {
      try {
        return katex.renderToString(tex, { throwOnError: false, output: 'html' });
      } catch (e) {
        return tex;
      }
    }

    // "q_1" -> "q_1" (already valid LaTeX subscript syntax); "q_12" -> "q_{12}"
    // so multi-character subscripts don't silently truncate to one character.
    function latexVar(name) {
      name = (name || '').trim();
      if (name.includes('_')) {
        const [base, sub] = name.split('_');
        return sub.length > 1 ? `${base}_{${sub}}` : `${base}_${sub}`;
      }
      return name;
    }

    function createConstraintInput(value, constraintIndex, part) {
      const input = document.createElement("input");
      input.type = "number";
      input.className = "constraint-input";
      input.value = value;
      input.onchange = (e) => {
        // When an input changes, update the model and re-render everything
        const newValue = parseFloat(e.target.value) || 0;
        constraintsList[constraintIndex][part] = newValue;
        document.getElementById('current-exercise-display').textContent = '';
        renderConstraints();
      };
      return input;
    }


    function refreshNumbers() {
      const constraintElems = constraintsDiv.querySelectorAll(".constraint");
      constraintElems.forEach((c, i) => {
        const numSpan = c.querySelector(".constraint-number");
        numSpan.textContent = `(${i + 1})`;
      });
    }

    function renderConstraints(animateLast = false) {
      constraintsDiv.innerHTML = "";
      step2Div.style.display = constraintsList.length > 0 ? "block" : "none";
      step3Div.style.display = constraintsList.length > 0 ? "block" : "none";
      resetZoomBtn.style.display = constraintsList.length > 0 ? "inline-block" : "none";

      // Update target function variable names
      const fnName = objFnNameInput.value || 'T';
      const v1Lp = latexVar(var1Input.value || "q_1");
      const v2Lp = latexVar(var2Input.value || "q_2");
      const v1Katex = M(v1Lp);
      const v2Katex = M(v2Lp);
      document.getElementById('obj-fn-text-1').innerHTML = M(`\\text{${fnName}}(${v1Lp}, ${v2Lp}) =`);
      document.getElementById('obj-fn-text-2').innerHTML = `<span class="v">${M(v1Lp)}</span><span class="op">${M('+')}</span>`;
      document.getElementById('obj-fn-text-3').innerHTML = `<span class="v">${M(v2Lp)}</span><span class="op">${M('+')}</span>`;


      const v1 = v1Katex;
      const v2 = v2Katex;

      constraintsList.forEach((c, index) => {
        const div = document.createElement("div");
        div.className = "constraint";

        const numberSpan = document.createElement("span");
        numberSpan.className = "constraint-number";
        div.appendChild(numberSpan);

        const span = document.createElement("span");
        div.appendChild(span);

        // Special rendering for the first two constraints (q1 and q2 bounds)
        if (index === 0) { // Constraint for q1
          span.insertAdjacentHTML('beforeend', `<span class="v">${v1}</span>`);
        } else if (index === 1) { // Constraint for q2
          span.insertAdjacentHTML('beforeend', `<span class="v">${v2}</span>`);
        } else { // Standard linear combination for all other constraints
          span.appendChild(createConstraintInput(c.c1, index, 'c1'));
          span.insertAdjacentHTML('beforeend', `<span class="v">${v1}</span><span class="op">${M('+')}</span>`);

          span.appendChild(createConstraintInput(c.c2, index, 'c2'));
          span.insertAdjacentHTML('beforeend', `<span class="v">${v2}</span>`);
        }

        // Common elements for all editable constraints: sign selector and RHS
        if (index > 1) {
          const signButton = document.createElement('button');
          signButton.className = 'constraint-sign';
          signButton.innerHTML = M(c.sign === 'le' ? '\\le' : '\\ge');
          signButton.onclick = () => {
              constraintsList[index].sign = constraintsList[index].sign === 'le' ? 'ge' : 'le';
              document.getElementById('current-exercise-display').textContent = '';
              renderConstraints();
          };
          span.appendChild(signButton);
        } else {
          const signSpan = document.createElement('span');
          signSpan.className = 'constraint-sign-disabled';
          signSpan.innerHTML = M('\\ge');
          span.appendChild(signSpan);
        }

        span.appendChild(createConstraintInput(c.rhs, index, 'rhs'));

        // The 'remove' button logic was previously inside an 'else' block.
        // It needs to be at this level to apply correctly.
        // Note: The logic to prevent deletion of the first two constraints is already correct.
        if (index > 1) {
          // Only allow deleting constraints other than the first two (the base non-negativity constraints)
          if (index > 1) {
            const removeBtn = document.createElement("button");
            removeBtn.className = "remove-btn";
            removeBtn.innerHTML = `<i class="bi bi-trash"></i>`; removeBtn.setAttribute('aria-label', 'Remove constraint');
            removeBtn.onclick = () => {
              document.getElementById('current-exercise-display').textContent = '';
              constraintsList.splice(index, 1);
              renderConstraints();
            };
            div.appendChild(removeBtn);
          }
        }
        constraintsDiv.appendChild(div); // This was in the wrong place

        // Apply animation to the last element if requested
        if (animateLast && index === constraintsList.length - 1) {
          div.style.animation = `fadeInSlideDown 1s ease-out forwards`;
        }
      });

      renderInequalitiesBreakdown();
      refreshNumbers();
    }

    // ---- worked solution: every step has the same shape (number, title, one line, then label/content rows) ----
    const stepHTML = (n, title, sub, body) => `<div class="step"><h3 class="step-heading"><span class="step-num-badge">${n}</span>${title}</h3>${sub ? `<p class="step-subtitle">${sub}</p>` : ''}<div class="step-body">${body}</div></div>`;
    const rowsHTML = rows => `<div class="rows">${rows.map(([l, c]) => `<span class="rl">${l}</span><div class="rc">${c}</div>`).join('')}</div>`;
    const cardHTML = (head, rows) => `<div class="icard"><div class="icard-h">${head}</div>${rowsHTML(rows)}</div>`;
    // a·v (LaTeX), skipping 0, writing 1 and −1 without the number
    const termL = (k, v) => k === 1 ? v : k === -1 ? `-${v}` : `${formatNumber(k)}${v}`;
    function linL(c1, v1, c2, v2, c = 0) {
      const t = [];
      if (c1 !== 0) t.push(termL(c1, v1));
      if (c2 !== 0) t.push((t.length && c2 > 0 ? '+ ' : '') + termL(c2, v2));
      if (c !== 0) t.push((t.length && c > 0 ? '+ ' : '') + formatNumber(c));
      return t.length ? t.join(' ') : '0';
    }
    // the left side with a point filled in: "300 · 0 + 400 · 0"
    function subL(c1, c2, x, y) {
      const t = [];
      if (c1 !== 0) t.push(c1 === 1 ? `${x}` : `${formatNumber(c1)} \\cdot ${x}`);
      if (c2 !== 0) t.push((t.length ? (c2 > 0 ? '+ ' : '- ') : (c2 < 0 ? '-' : '')) + (Math.abs(c2) === 1 ? `${y}` : `${formatNumber(Math.abs(c2))} \\cdot ${y}`));
      return t.join(' ');
    }
    const ptL = (x, y) => `(${formatNumber(x)},\\ ${formatNumber(y)})`;

    function renderInequalitiesBreakdown() {
      if (staticFeasibleRegionChart) { staticFeasibleRegionChart.destroy(); staticFeasibleRegionChart = null; }
      if (step6Chart) { step6Chart.destroy(); step6Chart = null; }
      const v1L = latexVar(var1Input.value || 'q_1'), v2L = latexVar(var2Input.value || 'q_2');

      let html = stepHTML(1, 'Variables', 'Say what each variable stands for. In a real problem, add its unit.',
        `<div class="var-display"><span class="var-chip">${M(v1L)}</span><span class="var-chip">${M(v2L)}</span></div>`);

      const cards = constraintsList.map((c, i) => {
        const signL = c.sign === 'le' ? '\\le' : '\\ge';
        const tp = c.rhs === 0 ? { x: 1, y: 1 } : { x: 0, y: 0 };
        const lhs = c.c1 * tp.x + c.c2 * tp.y, passes = c.sign === 'le' ? lhs <= c.rhs : lhs >= c.rhs;
        let boundary, remove;
        if (c.c1 !== 0 && c.c2 === 0) {
          const x = c.rhs / c.c1;
          boundary = M(`${v1L} = ${formatNumber(x)}`) + `<span class="sub">${x === 0 ? 'The vertical axis.' : 'A vertical line.'}</span>`;
          const side = tp.x < x ? 'left' : 'right';
          remove = `Everything to the ${passes ? (side === 'left' ? 'right' : 'left') : side} of the line.`;
        } else if (c.c1 === 0 && c.c2 !== 0) {
          const y = c.rhs / c.c2;
          boundary = M(`${v2L} = ${formatNumber(y)}`) + `<span class="sub">${y === 0 ? 'The horizontal axis.' : 'A horizontal line.'}</span>`;
          const side = tp.y < y ? 'below' : 'above';
          remove = `Everything ${passes ? (side === 'below' ? 'above' : 'below') : side} the line.`;
        } else {
          const pts = [];
          if (c.rhs === 0) {   // through the origin: the intercepts coincide, so take a second point on the line
            const px = c.c2 > 0 ? c.c2 : -c.c2, py = c.c2 > 0 ? -c.c1 : c.c1;
            pts.push(M(ptL(0, 0)), M(`${v1L} = ${formatNumber(px)} \\;\\Rightarrow\\; ${ptL(px, py)}`));
          } else {
            if (c.c2 !== 0) pts.push(M(`${v1L} = 0 \\;\\Rightarrow\\; ${ptL(0, c.rhs / c.c2)}`));
            if (c.c1 !== 0) pts.push(M(`${v2L} = 0 \\;\\Rightarrow\\; ${ptL(c.rhs / c.c1, 0)}`));
          }
          boundary = M(`${linL(c.c1, v1L, c.c2, v2L)} = ${formatNumber(c.rhs)}`) + `<span class="sub">Through ${pts.join('<br>and ')}</span>`;
          remove = `The side ${passes ? 'without' : 'with'} the point ${M(ptL(tp.x, tp.y))}.`;
        }
        const sub = subL(c.c1, c.c2, tp.x, tp.y), filled = sub === formatNumber(lhs) ? sub : `${sub} = ${formatNumber(lhs)}`;
        const test = M(`${ptL(tp.x, tp.y)}:\\quad ${filled} ${signL} ${formatNumber(c.rhs)}`) + ` <span class="${passes ? 'ok' : 'no'}">${passes ? '✓ true' : '✗ false'}</span>`;
        return cardHTML(`<span class="n">(${i + 1})</span>${M(formatConstraint(c, v1L, v2L))}`, [['Boundary', boundary], ['Test', test], ['Remove', remove]]);
      });
      html += stepHTML(2, 'Constraints', 'For each constraint: draw the boundary line, test a point, and remove the side where the constraint is false. What is left is the feasible region.', `<div class="cards">${cards.join('')}</div>`);
      html += stepHTML(3, 'Feasible region', 'The region where every constraint holds. The optimum is always at one of its corners (vertices).', `<div class="plot"><canvas id="staticFeasibleRegionChart"></canvas></div>`);
      inequalitiesBreakdownDiv.innerHTML = html;

      const fullData = renderFeasibleRegionGraph();
      renderSolutionSteps(fullData);
      updateSolutionSummary(fullData);
    }

    function renderSolutionSteps(fullData) {
      const { feasibleVertices, optimalVertexIndices, optimalValue, datasets, minX, maxX, minY, maxY } = fullData;
      const fnName = objFnNameInput.value || 'T';
      const a = parseFloat(objAInput.value) || 0, b = parseFloat(objBInput.value) || 0, c0 = parseFloat(objCInput.value) || 0;
      const v1_raw = var1Input.value || 'q_1', v2_raw = var2Input.value || 'q_2';
      const v1L = latexVar(v1_raw), v2L = latexVar(v2_raw);
      const mode = document.querySelector('#optimization-mode-toggle .segmented-btn.active').dataset.mode;
      const lv = [v1_raw, v2_raw].some(v => v.trim().toLowerCase() === 'a') ? 'L' : 'a';
      const objL = linL(a, v1L, b, v2L, c0);
      let html = '';

      // 4 · target function
      html += stepHTML(4, 'Target function', null, rowsHTML([['Function', M(`${fnName}(${v1L},\\ ${v2L}) = ${objL}`)], ['Goal', mode === 'maximize' ? 'Maximize' : 'Minimize']]));

      // 5 · contour lines
      const slope = b !== 0 ? -a / b : null;
      if (b !== 0) {
        const rest = c0 !== 0 ? `${lv} ${c0 > 0 ? '-' : '+'} ${formatNumber(Math.abs(c0))}` : lv;
        const moved = linL(-a, v1L, 0, v2L);
        html += stepHTML(5, 'Contour lines', `Set the target function equal to a level ${M(lv)} and solve for ${M(v2L)}. Every contour line has the same slope.`, rowsHTML([
          ['Level', M(`${objL} = ${lv}`)],
          ['Move', M(`${termL(b, v2L)} = ${a !== 0 ? moved + ' + ' : ''}${rest}`)],
          ['Solve', M(`${v2L} = ${a !== 0 ? termL(slope, v1L) + ' + ' : ''}${b === 1 ? rest : `\\dfrac{${rest}}{${formatNumber(b)}}`}`)],
          ['Slope', M(`${formatNumber(slope)}`)]]));
      } else if (a !== 0) {
        const rest = c0 !== 0 ? `${lv} ${c0 > 0 ? '-' : '+'} ${formatNumber(Math.abs(c0))}` : lv;
        html += stepHTML(5, 'Contour lines', `Set the target function equal to a level ${M(lv)}. Without ${M(v2L)} in it, every contour line is vertical.`, rowsHTML([
          ['Level', M(`${objL} = ${lv}`)], ['Solve', M(`${v1L} = ${a === 1 ? rest : `\\dfrac{${rest}}{${formatNumber(a)}}`}`)]]));
      }

      // 6 · direction: two contour lines through the lowest and highest vertex values
      const vals = feasibleVertices.map(v => a * v.x + b * v.y + c0);
      const level1 = vals.length ? Math.min(...vals) : 0, level2 = vals.length && Math.max(...vals) !== level1 ? Math.max(...vals) : level1 + 10;
      let cards = '', conclusion = '';
      if (b !== 0) {
        const lineCard = (n, L) => { const yi = (L - c0) / b, rows = [['Level', M(`${lv} = ${formatNumber(L)}`)], ['Line', M(`${v2L} = ${a !== 0 ? termL(slope, v1L) + ' + ' : ''}${formatNumber(yi)}`)]];
          const pts = [M(ptL(0, yi))]; if (a !== 0) pts.push(M(ptL((L - c0) / a, 0))); rows.push(['Through', pts.join(' and ')]); return cardHTML(`Line ${n}`, rows); };
        cards = lineCard(1, level1) + lineCard(2, level2);
        conclusion = `When the level goes from ${formatNumber(level1)} to ${formatNumber(level2)}, the line moves <strong>${(level2 - level1) / b > 0 ? 'up' : 'down'}</strong>.`;
      } else if (a !== 0) {
        const lineCard = (n, L) => cardHTML(`Line ${n}`, [['Level', M(`${lv} = ${formatNumber(L)}`)], ['Line', M(`${v1L} = ${formatNumber((L - c0) / a)}`)]]);
        cards = lineCard(1, level1) + lineCard(2, level2);
        conclusion = `When the level goes up, the vertical line moves to the <strong>${a > 0 ? 'right' : 'left'}</strong>.`;
      } else conclusion = 'The target function is constant, so every feasible point gives the same value.';
      html += stepHTML(6, 'Direction of improvement', 'Draw two contour lines with different levels and see which way the line moves when the level grows.',
        (cards ? `<div class="cards">${cards}</div>` : '') + `<p class="callout">${conclusion}${a !== 0 || b !== 0 ? ` To <strong>${mode}</strong>, slide the line ${mode === 'maximize' ? 'that way' : 'the other way'} as far as it goes while it still touches the feasible region.` : ''}</p>`
        + `<div class="plot" style="margin-top:14px"><canvas id="step6FeasibleRegionChart"></canvas></div>`);

      // 7 · optimum
      let body;
      const value = M(`${fnName} = ${formatNumber(optimalValue)}`);
      if (!optimalVertexIndices.length) body = '<p class="callout">There are no feasible vertices, so there is no optimal solution.</p>';
      else if (a === 0 && b === 0) body = `<p class="callout" style="margin-top:0">The target function is constant, so every point of the feasible region is optimal.</p><div class="answer">Every feasible point gives ${value}</div>`;
      else if (optimalVertexIndices.length === 1) {
        const i = optimalVertexIndices[0], v = feasibleVertices[i], L1 = constraintsList[v.line1 - 1], L2 = constraintsList[v.line2 - 1];
        const eq = c => formatConstraint(c, v1L, v2L).replace(/\\le|\\ge/g, '=');
        body = rowsHTML([['Vertex', `${String.fromCharCode(65 + i)}, where constraints (${v.line1}) and (${v.line2}) meet`],
          ['System', M(`\\begin{cases} ${eq(L1)} \\\\ ${eq(L2)} \\end{cases}`)],
          ['Solution', M(`${v1L} = ${formatNumber(v.x)},\\quad ${v2L} = ${formatNumber(v.y)}`)],
          ['Value', M(`${fnName} = ${subL(a, b, formatNumber(v.x), formatNumber(v.y)) || '0'}${c0 ? (c0 > 0 ? ' + ' : ' - ') + formatNumber(Math.abs(c0)) : ''} = ${formatNumber(optimalValue)}`)]])
          + `<div class="answer">Optimal point ${M(ptL(v.x, v.y))} with ${value}</div>`;
      } else {
        const [i, j] = optimalVertexIndices, A = String.fromCharCode(65 + i), B = String.fromCharCode(65 + j);
        body = `<p class="callout" style="margin-top:0">The contour line runs parallel to the edge from vertex ${A} to vertex ${B}, so every point on that edge is optimal.</p>`
          + rowsHTML([[`Vertex ${A}`, M(ptL(feasibleVertices[i].x, feasibleVertices[i].y))], [`Vertex ${B}`, M(ptL(feasibleVertices[j].x, feasibleVertices[j].y))]])
          + `<div class="answer">Every point from ${A} to ${B} gives ${value}</div>`;
      }
      html += stepHTML(7, 'Optimal solution', null, body);
      inequalitiesBreakdownDiv.insertAdjacentHTML('beforeend', html);

      // step 6 chart: feasible region, the two contour lines, optimum highlighted
      const step6Canvas = document.getElementById('step6FeasibleRegionChart');
      if (step6Canvas && datasets) {
        const ds = lightDatasets(JSON.parse(JSON.stringify(datasets)).filter(d => d.label !== 'Contour Line' && !d.label.startsWith('Constraint (')), optimalVertexIndices);
        const line = (L, faint) => {
          const data = b !== 0 ? [{ x: minX, y: slope * minX + (L - c0) / b }, { x: maxX * 1.1, y: slope * maxX * 1.1 + (L - c0) / b }] : [{ x: (L - c0) / a, y: minY }, { x: (L - c0) / a, y: maxY * 1.1 }];
          return { label: faint ? 'Contour 1' : 'Contour 2', type: 'line', fill: false, order: 3, pointRadius: 0, data, borderColor: faint ? 'rgba(255, 85, 0, 0.45)' : '#ff5500', borderWidth: faint ? 1.5 : 2, borderDash: faint ? [5, 4] : [] };
        };
        if (a !== 0 || b !== 0) ds.push(line(level1, true), line(level2, false));
        step6Chart = new Chart(step6Canvas, { type: 'scatter', data: { datasets: ds }, plugins: [regionOverlay()], options: staticChartOptions(minX, maxX, minY, maxY) });
        step6Chart.$optimalVertexIndices = optimalVertexIndices;
      }
    }

    // shared pieces for the two small charts in the solution
    // the main chart is drawn on dark glass; the paper charts copy its datasets and recolour them
    function lightDatasets(ds, optimal = []) {
      ds.forEach(d => {
        if (d.label === 'Feasible Region') { d.borderColor = 'rgba(131, 172, 178, 0.6)'; d.borderWidth = 3; }
        else if (d.label.startsWith('Constraint (')) { d.borderColor = 'rgba(100, 116, 139, 0.5)'; d.borderWidth = 1; }
        else if (d.label === 'Feasible Vertices') {
          d.backgroundColor = d.data.map((_, i) => optimal.includes(i) ? '#ff5500' : '#83acb2');
          d.borderColor = d.data.map((_, i) => optimal.includes(i) ? '#cc2200' : '#2f6a73');
        }
      });
      return ds;
    }
    function regionOverlay() {
      return { id: 'feasibleRegionOverlay', afterDraw: chart => {
        const ctx = chart.ctx, k = chart.data.datasets.findIndex(d => d.label === 'Feasible Region');
        if (k !== -1) { const m = chart.getDatasetMeta(k);
          if (m && m.data && m.data.length >= 3) { ctx.save(); ctx.beginPath(); m.data.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fillStyle = 'rgba(131, 172, 178, 0.22)'; ctx.fill(); ctx.restore(); } }
        drawVertexLabels(chart); drawYAxisLabel(chart);
      } };
    }
    function staticChartOptions(minX, maxX, minY, maxY) {
      const grid = { lineWidth: c => (c.tick.value === 0 ? 1.5 : 1), color: c => (c.tick.value === 0 ? 'rgba(12, 56, 64, 0.5)' : 'rgba(12, 56, 64, 0.06)') };
      return {
        scales: {
          x: { type: 'linear', position: 'bottom', min: minX, max: maxX * 1.1, title: { display: true, text: toSubscript(var1Input.value), font: { size: 15, family: 'STIX Two Text', style: 'italic', weight: '500' } }, grid, ticks: { callback: v => formatNumber(v), font: { size: 10 } } },
          y: { min: minY, max: maxY * 1.1, title: { display: false }, grid, ticks: { callback: v => formatNumber(v), font: { size: 10 } } }
        },
        layout: { padding: { left: 26 } },
        plugins: { zoom: { zoom: { wheel: { enabled: false } }, pan: { enabled: false } }, legend: { display: false }, tooltip: { enabled: false } },
        responsive: true, maintainAspectRatio: false
      };
    }

    function updateSolutionSummary(solutionData) {
      if (!solutionData || !solutionData.optimalVertexIndices || solutionData.optimalVertexIndices.length === 0) {
        summaryCard.style.display = 'none';
        return;
      }

      const { feasibleVertices, optimalVertexIndices, optimalValue } = solutionData;
      const mode = document.querySelector('#optimization-mode-toggle .segmented-btn.active').dataset.mode;
      const fnName = objFnNameInput.value || 'T';

      let pointsHTML = '';
      if (!(parseFloat(objAInput.value) || 0) && !(parseFloat(objBInput.value) || 0)) pointsHTML = 'Any feasible point';
      else if (optimalVertexIndices.length === 1) {
        const optimalVertex = feasibleVertices[optimalVertexIndices[0]];
        pointsHTML = `(${formatNumber(optimalVertex.x)}, ${formatNumber(optimalVertex.y)})`;
      } else {
        const vertex1Index = optimalVertexIndices[0];
        const vertex2Index = optimalVertexIndices[1];
        const vertex1Letter = String.fromCharCode(65 + vertex1Index);
        const vertex2Letter = String.fromCharCode(65 + vertex2Index);
        pointsHTML = `Edge ${vertex1Letter} to ${vertex2Letter}`;
      }

      summaryCard.innerHTML = `
        <button type="button" class="summary-item goal-toggle" title="Switch between maximize and minimize">
          <div class="label">Goal</div>
          <div class="value">${mode === 'maximize' ? 'Maximize' : 'Minimize'}</div><i class="bi bi-arrow-down-up"></i>
        </button>
        <div class="summary-item">
          <div class="label">Optimal Point</div>
          <div class="value">${pointsHTML}</div>
        </div>
        <div class="summary-item">
          <div class="label">Optimal Value</div>
          <div class="value">${fnName} = ${formatNumber(optimalValue)}</div>
        </div>`;
      summaryCard.style.display = 'grid';
    }

    function renderFeasibleRegionGraph(preserveZoom = false) {
      const lines = constraintsList.map(c => {
        return { c1: c.c1, c2: c.c2, rhs: c.rhs, sign: c.sign };
      });

      // Find all intersection points
      const intersectionPoints = [];
      for (let i = 0; i < lines.length; i++) {
        for (let j = i + 1; j < lines.length; j++) {
          const p1 = lines[i];
          const p2 = lines[j];

          const det = p1.c1 * p2.c2 - p2.c1 * p1.c2;
          if (det !== 0) { // If lines are not parallel
            const x = (p2.c2 * p1.rhs - p1.c2 * p2.rhs) / det;
            const y = (p1.c1 * p2.rhs - p2.c1 * p1.rhs) / det;
            if (x >= -1e-9 && y >= -1e-9) { // Only consider points in or very near the first quadrant
              intersectionPoints.push({ x, y, line1: i + 1, line2: j + 1 });
            }
          }
        }
      }

      // Find intercepts for scaling the chart
      const axisIntercepts = [];
      lines.forEach(l => {
        if (l.c1 !== 0) axisIntercepts.push({ x: l.rhs / l.c1, y: 0 });
        if (l.c2 !== 0) axisIntercepts.push({ x: 0, y: l.rhs / l.c2 });
      });

      // Filter for feasible vertices (several lines through one point give that point only once)
      const feasibleVertices = intersectionPoints.filter((p, i) => intersectionPoints.findIndex(q => Math.abs(q.x - p.x) < 1e-7 && Math.abs(q.y - p.y) < 1e-7) === i).filter(p => {
        return constraintsList.every(c => {
          const epsilon = 1e-9; // Tolerance for floating point inaccuracies
          return c.sign === 'le' ? (c.c1 * p.x + c.c2 * p.y <= c.rhs + epsilon) : (c.c1 * p.x + c.c2 * p.y >= c.rhs - epsilon);
        });
      });

      // Sort vertices to form a convex polygon
      if (feasibleVertices.length > 1) {
        const center = feasibleVertices.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
        center.x /= feasibleVertices.length;
        center.y /= feasibleVertices.length;
        feasibleVertices.sort((a, b) => Math.atan2(a.y - center.y, a.x - center.x) - Math.atan2(b.y - center.y, b.x - center.x));
      }

      // --- Find Optimal Vertex ---
      let optimalVertexIndices = []; // Can be multiple if solutions are degenerate
      if (feasibleVertices.length > 0) {
        const a = parseFloat(objAInput.value) || 0;
        const b = parseFloat(objBInput.value) || 0;
        const c_offset = parseFloat(objCInput.value) || 0;
        const mode = document.querySelector('#optimization-mode-toggle .segmented-btn.active').dataset.mode;

        // First pass: calculate all objective values and find the single optimal value
        optimalValue = mode === 'maximize' ? -Infinity : Infinity;
        feasibleVertices.forEach(p => {
          const value = a * p.x + b * p.y + c_offset;
          p.objValue = value; // Store value for tooltip

          if (mode === 'maximize') {
            if (value > optimalValue) optimalValue = value;
          } else { // minimize
            if (value < optimalValue) optimalValue = value;
          }
        });

        // Second pass: find all vertices that match the optimal value (using a tolerance)
        const tolerance = 1e-9;
        feasibleVertices.forEach((p, index) => {
          if (Math.abs(p.objValue - optimalValue) < tolerance) {
            optimalVertexIndices.push(index);
          }
        });


      }


      // Determine chart axis limits
      const allPoints = [...feasibleVertices, ...axisIntercepts];
      const maxX = Math.max(10, ...allPoints.filter(p => p.x >= 0 && p.y >= 0).map(p => p.x));
      const maxY = Math.max(10, ...allPoints.filter(p => p.x >= 0 && p.y >= 0).map(p => p.y));

      // Calculate min values to show some negative space (e.g., 10% of the max value)
      const minX = -maxX * 0.1;
      const minY = -maxY * 0.1;


      // --- New Logic for Slider Range ---
      const a = parseFloat(objAInput.value) || 0;
      const b = parseFloat(objBInput.value) || 0;
      const c_offset = parseFloat(objCInput.value) || 0;

      // Calculate objective function values at each vertex to find the range
      const vertexValues = feasibleVertices.map(p => a * p.x + b * p.y + c_offset);

      // Also consider the value at the origin (0,0) and the max corner (maxX, maxY) to create a sensible range
      vertexValues.push(c_offset); // Value at (0,0)
      vertexValues.push(a * maxX + b * maxY + c_offset); // Value at (maxX, maxY)

      const minLevel = Math.min(...vertexValues);
      const maxLevel = Math.max(...vertexValues);

      // Update slider range and draw initial contour line
      updateSliderRange(minLevel, maxLevel);
      drawContourLine(minX, maxX, minY, maxY);

      // Prepare datasets for Chart.js
      const datasets = [];

      // 1. Feasible region polygon
      if (feasibleVertices.length > 0) {
        datasets.push({
          label: 'Feasible Region',
          data: [...feasibleVertices, feasibleVertices[0]], // Close the polygon
          fill: false, // The actual fill is painted by the feasibleRegionOverlay plugin (afterDraw),
                        // since Chart.js's own line fill fills toward the axis origin, not the
                        // enclosed polygon shape — this dataset only supplies the vertex positions.
          borderColor: 'rgba(248, 248, 242, 0.85)',
          borderWidth: 2,
          showLine: true,
          type: 'line', // Use 'line' type for the dataset to enable filling
          pointRadius: 0, // No points on the polygon line itself
          order: 1 // Draw the region first
        });
      }

      // 2. Boundary lines
      if (visibilityState.boundaries) {
        lines.forEach((l, i) => {
          const linePoints = []; // Points to draw the boundary line
          const extendedMaxX = maxX * 1.1;
          const extendedMaxY = maxY * 1.1;

          if (l.c2 !== 0) { // Not a vertical line
            const yAtX0 = l.rhs / l.c2;
            const yAtXMax = (l.rhs - l.c1 * extendedMaxX) / l.c2;
            linePoints.push({ x: 0, y: yAtX0 });
            linePoints.push({ x: extendedMaxX, y: yAtXMax });
          } else if (l.c1 !== 0) { // Vertical line
            const x = l.rhs / l.c1;
            linePoints.push({ x: x, y: 0 });
            linePoints.push({ x: x, y: extendedMaxY });
          } // else it's 0=0, which can't be drawn

          datasets.push({
            label: `Constraint (${i + 1})`,
            data: linePoints,
            borderColor: 'rgba(131, 172, 178, 0.5)',
            borderWidth: 1.2,
            borderDash: [6, 3], // Dashed line effect
            showLine: true,
            pointRadius: 0,
            type: 'line',
            fill: false,
            order: 2 // Draw boundaries over the region
          });
        });
      }

      // 3. Feasible vertices points
      if (visibilityState.vertices) {
        datasets.push({
          label: 'Feasible Vertices',
          data: feasibleVertices,
          backgroundColor: feasibleVertices.map((_, i) => optimalVertexIndices.includes(i) ? '#ff5500' : '#f8f8f2'),
          borderColor: feasibleVertices.map((_, i) => optimalVertexIndices.includes(i) ? '#a83200' : '#0c3840'),
          borderWidth: 1.5,
          pointRadius: feasibleVertices.map((_, i) => optimalVertexIndices.includes(i) ? 8 : 5), // Larger radius for optimal
          pointHoverRadius: feasibleVertices.map((_, i) => optimalVertexIndices.includes(i) ? 10 : 7),
          pointStyle: 'circle', 
          order: -1, // Chart.js draws lower order on top, so this puts vertices above every line
          type: 'scatter',
        });
      }

      // Define tooltip callbacks here to capture the correct optimalVertexIndices
      const tooltipCallbacks = {
        callbacks: {
          label: function(context) {
            const datasetLabel = context.dataset.label || '';

            // Custom tooltip for Vertices
            if (datasetLabel === 'Feasible Vertices') {
              const point = context.raw; // The original data object
              const isOptimal = optimalVertexIndices.includes(context.dataIndex);
              const vertexLabel = `${isOptimal ? 'Optimal ' : ''}Vertex ${String.fromCharCode(65 + context.dataIndex)}`;
              const coords = `(${formatNumber(point.x)}, ${formatNumber(point.y)})`;
              const intersection = `Intersection of lines (${point.line1}) and (${point.line2})`; 
              const fnName = objFnNameInput.value || 'T';
              const objValue = `${fnName} = ${formatNumber(point.objValue)}`;
              return [vertexLabel, coords, intersection, objValue]; // Return array for multi-line tooltip
            }
            // Simple label for other lines
            if (datasetLabel.startsWith('Constraint')) return datasetLabel;
            return `${datasetLabel}: (${context.parsed.x.toFixed(2)}, ${context.parsed.y.toFixed(2)})`;
          }
        }
      };
      // Create or update the chart
      if (feasibleRegionChart) {
        feasibleRegionChart.data.datasets = datasets;
        feasibleRegionChart.options.scales.x.title.text = toSubscript(var1Input.value);
        feasibleRegionChart.options.scales.x.title.font.size = 15;
        // The y-axis label is drawn by drawYAxisLabel (afterDraw), which reads
        // var2Input.value live, so there's nothing to update here for it.
        if (!preserveZoom) {
          feasibleRegionChart.options.scales.x.max = maxX * 1.1; // Keep this line
          feasibleRegionChart.options.scales.x.min = minX;
          feasibleRegionChart.options.scales.y.max = maxY * 1.1;
          feasibleRegionChart.options.scales.y.min = minY;
        }
        feasibleRegionChart.options.plugins.tooltip = tooltipCallbacks;
        feasibleRegionChart.$optimalVertexIndices = optimalVertexIndices;
        feasibleRegionChart.update('none'); // Use 'none' for a smoother update
      } else {
        feasibleRegionChart = new Chart(chartCanvas, {
          type: 'scatter', // Set the main chart type to 'scatter'
          data: { datasets },
          plugins: [{
            id: 'feasibleRegionOverlay',
            // both axes drawn by hand: a tick at 0 isn't guaranteed, so the grid can miss them
            beforeDatasetsDraw: chart => {
              const { ctx, chartArea: ca, scales: { x, y } } = chart;
              ctx.save(); ctx.strokeStyle = 'rgba(248, 248, 242, 0.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
              const x0 = x.getPixelForValue(0), y0 = y.getPixelForValue(0);
              if (x0 >= ca.left && x0 <= ca.right) { ctx.moveTo(x0, ca.top); ctx.lineTo(x0, ca.bottom); }
              if (y0 >= ca.top && y0 <= ca.bottom) { ctx.moveTo(ca.left, y0); ctx.lineTo(ca.right, y0); }
              ctx.stroke(); ctx.restore();
            },
            afterDraw: chart => {
              const ctx = chart.ctx;

              // Draw feasible region as filled polygon
              const fDsIdx = chart.data.datasets.findIndex(d => d.label === 'Feasible Region');
              if (fDsIdx !== -1) {
                const fMeta = chart.getDatasetMeta(fDsIdx);
                if (fMeta && fMeta.data && fMeta.data.length >= 3) {
                  ctx.save();
                  ctx.beginPath();
                  fMeta.data.forEach((pt, i) => { i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y); });
                  ctx.closePath();
                  ctx.fillStyle = 'rgba(248, 248, 242, 0.14)';
                  ctx.fill();
                  ctx.restore();
                }
              }

              drawVertexLabels(chart);
              drawYAxisLabel(chart);
            }
          }],
          options: {
            scales: {
              x: {
                type: 'linear',
                position: 'bottom',
                afterBuildTicks: dropUnevenEdgeTicks,
                min: minX,
                max: maxX * 1.1,
                title: {
                  display: true,
                  text: toSubscript(var1Input.value),
                  color: '#f8f8f2',
                  font: {
                    size: 15,
                    family: "STIX Two Text",
                    style: 'italic',
                    weight: '500'
                  }
                },
                grid: {
                  z: -1, // Draw grid lines behind datasets
                  lineWidth: (context) => (context.tick.value === 0 ? 1.5 : 1), // Bolder line for the axis
                  color: 'rgba(255, 255, 255, 0.07)',
                },
                ticks: {
                  color: '#a9c6ca',
                  callback: function(value) {
                    return formatNumber(value);
                  }
                }
              },
              y: {
                min: minY,
                max: maxY * 1.1,
                afterBuildTicks: dropUnevenEdgeTicks,
                title: { display: false }, // Drawn horizontally by drawYAxisLabel instead
                grid: {
                  z: -1, // Draw grid lines behind datasets
                  lineWidth: (context) => (context.tick.value === 0 ? 1.5 : 1), // Bolder line for the axis
                  color: 'rgba(255, 255, 255, 0.07)',
                },
                ticks: {
                  color: '#a9c6ca',
                  callback: function(value) {
                    return formatNumber(value);
                  }
                }
              }
            },
            layout: { padding: { left: 26 } },
            plugins: {
              zoom: {
                pan: {
                  enabled: true,
                  mode: 'xy',
                  onPanComplete: ({chart}) => { updateSliderRangeForVisibleArea(chart); chart.update('none'); } // Redraw contour on pan
                },
                zoom: {
                  wheel: {
                    enabled: true,
                    speed: 0.02,
                  },
                  pinch: {
                    enabled: true
                  },
                  mode: 'xy',
                  onZoomComplete: ({chart}) => { updateSliderRangeForVisibleArea(chart); chart.update('none'); } // Redraw contour on zoom
                },
                limits: {
                  x: {min: minX},
                  y: {min: minY}
                }
              },
              legend: { display: false },
              tooltip: tooltipCallbacks
            },
            responsive: true,
            maintainAspectRatio: false,
          }
        });
        feasibleRegionChart.$optimalVertexIndices = optimalVertexIndices;
        feasibleRegionChart.$dark = true;
      }

      const solutionData = { feasibleVertices, optimalVertexIndices, optimalValue };

      renderStaticFeasibleRegionGraph({ datasets, minX, maxX, minY, maxY, solutionData });

      // Return the calculated solution so it can be used in the breakdown steps
      return { ...solutionData, datasets, minX, maxX, minY, maxY };
    }

    function updateSliderRangeForVisibleArea(chart) {
      if (!chart) return;

      const { min: minX, max: maxX } = chart.scales.x;
      const { min: minY, max: maxY } = chart.scales.y;

      const a = parseFloat(objAInput.value) || 0;
      const b = parseFloat(objBInput.value) || 0;
      const c_offset = parseFloat(objCInput.value) || 0;

      // Calculate the objective function value at the four corners of the visible area
      const cornerValues = [
        a * minX + b * minY + c_offset,
        a * minX + b * maxY + c_offset,
        a * maxX + b * minY + c_offset,
        a * maxX + b * maxY + c_offset,
      ];

      const minLevel = Math.min(...cornerValues);
      const maxLevel = Math.max(...cornerValues);

      updateSliderRange(minLevel, maxLevel);
    }

    function updateSliderRange(min, max) {
      // Set the slider range based on the min/max values of the objective function
      levelSlider.min = min;
      const effectiveMax = (min === max) ? max + 100 : max; // Avoid a zero-width range
      levelSlider.max = effectiveMax;

      // Dynamically calculate a reasonable step for the slider
      const range = effectiveMax - min;
      let step = 1;
      if (range > 0) {
        // Aim for about 100-200 steps. We calculate a "nice" step value
        // based on the order of magnitude of the range.
        const powerOf10 = Math.pow(10, Math.floor(Math.log10(range)) - 2);
        step = Math.max(powerOf10, 0.01); // Set a minimum step to avoid issues with very small ranges
      }
      levelSlider.step = step;

      const midValue = (parseFloat(levelSlider.min) + parseFloat(levelSlider.max)) / 2;
      levelSlider.value = midValue;
      // Also update the displayed value
      document.getElementById('level-value').value = formatNumber(midValue);
      updateSliderFill(levelSlider);
    }

    function updateSliderFill(slider) {
      const min = parseFloat(slider.min);
      const max = parseFloat(slider.max);
      const value = parseFloat(slider.value);
      const percentage = max > min ? ((value - min) / (max - min)) * 100 : 50;
      slider.style.setProperty('--progress', `${percentage}%`);
    }

    function drawContourLine(minX, maxX, minY, maxY) { 
      if (!feasibleRegionChart) return;

      const a = parseFloat(document.getElementById('obj-a').value) || 0;
      const b = parseFloat(document.getElementById('obj-b').value) || 0;
      const c = parseFloat(document.getElementById('obj-c').value) || 0;
      const level = parseFloat(levelSlider.value);
      document.getElementById('level-value').value = formatNumber(level);
      updateSliderFill(levelSlider);

      // Find and remove the old contour line first
      const contourIndex = feasibleRegionChart.data.datasets.findIndex(d => d.label === 'Contour Line');
      if (contourIndex !== -1) {
        feasibleRegionChart.data.datasets.splice(contourIndex, 1);
      }
      if (!visibilityState.contour) { feasibleRegionChart.update('none'); return; }

      const contourPoints = [];

      if (b !== 0) {
        const slope = -a / b;
        const intercept = (level - c) / b;
        contourPoints.push({ x: minX, y: slope * minX + intercept });
        contourPoints.push({ x: maxX, y: slope * maxX + intercept });
      } else if (a !== 0) { // Vertical line
        const x_val = (level - c) / a;
        contourPoints.push({ x: x_val, y: minY });
        contourPoints.push({ x: x_val, y: maxY });
      }

      const contourDataset = {
        label: 'Contour Line',
        data: contourPoints,
        borderColor: '#ff5500',
        borderWidth: 2.5,
        type: 'line',
        pointRadius: 0,
        order: 4, // Draw contour on top of boundaries
      };

      feasibleRegionChart.data.datasets.push(contourDataset);
      feasibleRegionChart.update('none');
    }

    function renderStaticFeasibleRegionGraph(chartData) {
      const { datasets, minX, maxX, minY, maxY, solutionData } = chartData;
      const staticChartCanvas = document.getElementById('staticFeasibleRegionChart');
      if (!staticChartCanvas) return;

      const staticDatasets = lightDatasets(JSON.parse(JSON.stringify(datasets)).filter(d => d.label !== 'Contour Line'));

      // Step 3 shows the feasible set only — no optimal point distinction
      const verticesDs = staticDatasets.find(d => d.label === 'Feasible Vertices');
      if (verticesDs) {
        const n = verticesDs.data.length;
        verticesDs.backgroundColor = Array(n).fill('#83acb2');
        verticesDs.borderColor = Array(n).fill('#2f6a73');
        verticesDs.pointRadius = Array(n).fill(5);
        verticesDs.pointHoverRadius = Array(n).fill(7);
      }

      if (staticFeasibleRegionChart) {
        staticFeasibleRegionChart.data.datasets = staticDatasets;
        staticFeasibleRegionChart.options.scales.x.title.text = toSubscript(var1Input.value);
        staticFeasibleRegionChart.options.scales.x.max = maxX * 1.1;
        staticFeasibleRegionChart.options.scales.x.min = minX;
        staticFeasibleRegionChart.options.scales.y.max = maxY * 1.1;
        staticFeasibleRegionChart.options.scales.y.min = minY;
        staticFeasibleRegionChart.update('none');
      } else {
        staticFeasibleRegionChart = new Chart(staticChartCanvas, {
          type: 'scatter',
          data: { datasets: staticDatasets },
          plugins: [{
            id: 'feasibleRegionOverlay',
            afterDraw: chart => {
              const ctx = chart.ctx;

              // Draw feasible region as filled polygon
              const fDsIdx = chart.data.datasets.findIndex(d => d.label === 'Feasible Region');
              if (fDsIdx !== -1) {
                const fMeta = chart.getDatasetMeta(fDsIdx);
                if (fMeta && fMeta.data && fMeta.data.length >= 3) {
                  ctx.save();
                  ctx.beginPath();
                  fMeta.data.forEach((pt, i) => { i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y); });
                  ctx.closePath();
                  ctx.fillStyle = 'rgba(131, 172, 178, 0.2)';
                  ctx.fill();
                  ctx.restore();
                }
              }

              // Step 3 shows the feasible set only — no optimal-vertex distinction yet,
              // so chart.$optimalVertexIndices is deliberately left unset here.
              drawVertexLabels(chart);
              drawYAxisLabel(chart);
            }
          }],
          options: {
            scales: {
              x: {
                type: 'linear', position: 'bottom', min: minX, max: maxX * 1.1,
                title: { display: true, text: toSubscript(var1Input.value), font: { size: 15, family: "STIX Two Text", style: 'italic', weight: '500' } },
                grid: {
                  lineWidth: (context) => (context.tick.value === 0 ? 1.5 : 1),
                  color: (context) => (context.tick.value === 0 ? 'rgba(0, 0, 0, 0.5)' : 'rgba(0, 0, 0, 0.05)'),
                },
                ticks: { callback: (value) => formatNumber(value), font: { size: 10 } }
              },
              y: {
                min: minY, max: maxY * 1.1,
                title: { display: false }, // Drawn horizontally by drawYAxisLabel instead
                grid: {
                  lineWidth: (context) => (context.tick.value === 0 ? 1.5 : 1),
                  color: (context) => (context.tick.value === 0 ? 'rgba(0, 0, 0, 0.5)' : 'rgba(0, 0, 0, 0.05)'),
                },
                ticks: { callback: (value) => formatNumber(value), font: { size: 10 } }
              }
            },
            layout: { padding: { left: 26 } },
            plugins: {
              zoom: { zoom: { wheel: { enabled: false } }, pan: { enabled: false } }, // Disable zoom/pan
              legend: { display: false },
              tooltip: { enabled: false }, // Disable tooltips
            },
            responsive: true,
            maintainAspectRatio: false,
          }
        });
      }
    }

    async function loadExercise(id) {
      try {
        const exercises = await getExercises();
        const exercise = exercises[id];

        if (exercise) {
          // Clear current state
          constraintsList = [];
          document.getElementById('current-exercise-display').textContent = exercise.label || `Question ${id}`;

          // Animate in the new settings

          var1Input.value = exercise.variables.var1;
          var2Input.value = exercise.variables.var2;
          objFnNameInput.value = exercise.target.name || 'T';

          objAInput.value = exercise.target.a;
          objBInput.value = exercise.target.b;
          objCInput.value = exercise.target.c;
          
          optimizationModeToggle.querySelectorAll('.segmented-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === exercise.target.mode);
          });

          // Load all constraints at once
          constraintsList = exercise.constraints.map(c => ({ ...c, type: 'editable' }));
          renderConstraints();

        } else {
          alert(`Exercise ${id} not found in linearprog-exercises.json`);
        }
      } catch (error) {
        console.error("Could not load exercises:", error);
        alert("Failed to load linearprog-exercises.json. Please check the file and the console for errors.");
      }
      step2Div.classList.add('collapsed'); // Start collapsed
      syncStep2Icon();
    }

    // Returns a LaTeX string (not HTML) — wrap the result in M() to render it.
    // v1/v2 here are expected to already be LaTeX variable names (see latexVar()).
    function formatConstraint(c, v1, v2) {
        if (c.type === 'base') {
            return c.text.replace(/\{\{v1\}\}/g, v1).replace(/\{\{v2\}\}/g, v2).replace(/≥/g, '\\ge').replace(/≤/g, '\\le');
        }

        const terms = [];
        if (c.c1 !== 0) {
            if (c.c1 === 1) terms.push(v1);
            else if (c.c1 === -1) terms.push(`-${v1}`);
            else terms.push(`${formatNumber(c.c1)}${v1}`);
        }

        if (c.c2 !== 0) {
            if (terms.length > 0 && c.c2 > 0) terms.push('+');
            if (c.c2 === 1) terms.push(v2);
            else if (c.c2 === -1) terms.push(`-${v2}`);
            else terms.push(`${formatNumber(c.c2)}${v2}`);
        }

        if (terms.length === 0) {
            terms.push('0');
        }

        const sign = c.sign === 'le' ? '\\le' : '\\ge';
        return `${terms.join(' ')} ${sign} ${formatNumber(c.rhs)}`;
    }

    addBtn.addEventListener("click", () => {
      constraintsList.push({ c1: 1, c2: 1, rhs: 10, type: 'editable', sign: 'le' });
      document.getElementById('current-exercise-display').textContent = '';
      renderConstraints();
    });

    function handleInputChange(fullRender = true) {
        document.getElementById('current-exercise-display').textContent = '';
        if (fullRender) renderConstraints();
    }

    var1Input.addEventListener("change", handleInputChange);
    var2Input.addEventListener("change", handleInputChange);

    objFnNameInput.addEventListener("change", handleInputChange);
    objAInput.addEventListener("change", handleInputChange);
    objBInput.addEventListener("change", handleInputChange);
    objCInput.addEventListener("change", handleInputChange);

    function handleLevelChange() {
      if (!feasibleRegionChart) return;

      // If contour is not visible, turn it on when the user starts sliding
      if (!visibilityState.contour) {
        visibilityState.contour = true;
        const contourBtn = document.querySelector('.chart-toggle-btn[data-target="contour"]');
        if (contourBtn) contourBtn.classList.add('active');
      }

      const minX = feasibleRegionChart.options.scales.x.min;
      const maxX = feasibleRegionChart.options.scales.x.max;
      const minY = feasibleRegionChart.options.scales.y.min;
      const maxY = feasibleRegionChart.options.scales.y.max;
      drawContourLine(minX, maxX, minY, maxY);
    }

    levelSlider.addEventListener('input', handleLevelChange);

    const levelValueInput = document.getElementById('level-value');
    levelValueInput.addEventListener('change', () => {
      const min = parseFloat(levelSlider.min);
      const max = parseFloat(levelSlider.max);
      let typed = parseFloat(levelValueInput.value);
      if (isNaN(typed)) typed = parseFloat(levelSlider.value);
      typed = Math.min(max, Math.max(min, typed));
      levelSlider.value = typed;
      handleLevelChange();
    });
    levelValueInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') levelValueInput.blur();
    });

    var1Input.addEventListener("change", renderConstraints);
    var2Input.addEventListener("change", renderConstraints);


    function loadDefaultState() {
      document.getElementById('current-exercise-display').textContent = '';

      // Set default variable names
      var1Input.value = 'x';
      var2Input.value = 'y';
      objFnNameInput.value = 'T';

      // Set default target function coefficients
      objAInput.value = 1;
      objBInput.value = 1;
      objCInput.value = 0;

      // Set default optimization mode to maximize
      optimizationModeToggle.querySelectorAll('.segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === 'maximize');
      });

      // Set default constraints (x >= 0 and y >= 0)
      constraintsList = [
        { c1: 1, c2: 0, rhs: 0, sign: 'ge', type: 'base', text: '{{v1}} ≥ 0' },
        { c1: 0, c2: 1, rhs: 0, sign: 'ge', type: 'base', text: '{{v2}} ≥ 0' }
      ];
      renderConstraints();
    }

    // Load the default state on page load
    loadDefaultState();
  </script>
