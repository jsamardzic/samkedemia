.shell { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 20px 56px; }
.brand-header { max-width: 800px; height: 68px; margin: 0 auto 38px; padding: 0 16px 0 30px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: linear-gradient(var(--glass-top), var(--glass-bottom)); border: 1.5px solid var(--glass-border); border-radius: 100px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .12); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 20; }
.brand-logo { display: flex; align-items: center; text-decoration: none; min-width: 0; }
.brand-logo img { height: 28px; width: auto; display: block; }
.logo-separator { width: 1px; height: 38px; background: var(--glass-border); margin: 0 18px; flex: none; }
.logo-page-title { font: 700 1.05rem/1 var(--font-body); color: var(--cream); white-space: nowrap; }
.header-socials { display: flex; gap: 10px; }
.social-icon { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .07); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; color: var(--cream); transition: transform .3s, background-color .3s, border-color .3s; }
.social-icon:hover { transform: translateY(-2px); background: var(--orange); border-color: var(--orange); }
.social-icon svg { width: 18px; height: 18px; }
@media (max-width: 650px) { .header-socials a:nth-child(n+2) { display: none; } }
@media (max-width: 520px) { .logo-page-title, .logo-separator { display: none; } .brand-header { padding-left: 22px; } }
/* ---- the instrument: one glass panel, one canvas, a control dock underneath ---- */
.stage { position: relative; max-width: 1080px; margin: 0 auto; border-radius: 28px; overflow: hidden;
  background: linear-gradient(var(--glass-top), var(--glass-bottom)); border: 1.5px solid var(--glass-border);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#cv { display: block; width: 100%; height: 520px; touch-action: pan-y; }
.shell { padding-bottom: 16px; } .brand-header { margin-bottom: 22px; }
.dock { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; justify-content: space-between; padding: 18px 24px 22px; border-top: 1px solid var(--glass-border); background: rgba(5, 22, 25, .28); }
.group { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.glabel { font: 700 .7rem/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--orange); white-space: nowrap; }
.seg { position: relative; display: flex; padding: 4px; border-radius: 100px; background: rgba(0, 0, 0, .28); border: 1px solid var(--glass-border); max-width: 100%; }
.seg button { position: relative; z-index: 1; appearance: none; border: 0; background: none; color: var(--quiet); font: 700 .86rem/1 var(--font-body); padding: 9px 14px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: color .3s; -webkit-tap-highlight-color: transparent; }
.seg button:hover { color: var(--cream); }
.seg button[aria-pressed="true"] { color: var(--ground); }
.seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.seg svg { width: 28px; height: 14px; flex: none; overflow: visible; }
.seg .ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 100px; background: var(--cream); box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  transition: transform .5s cubic-bezier(.3, 1.3, .45, 1), width .5s cubic-bezier(.3, 1.3, .45, 1); }
#nSeg button { min-width: 44px; padding-inline: 10px; font-family: var(--font-num); font-size: .95rem; }
.actions { flex-direction: row; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; width: 100%; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .07); }
.btn { appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 100px; cursor: pointer;
  font: 700 .9rem/1 var(--font-body); color: var(--cream); background: rgba(255, 255, 255, .07); border: 1px solid var(--glass-border);
  transition: background-color .25s, border-color .25s, transform .15s; -webkit-tap-highlight-color: transparent; }
.btn:hover { background: rgba(255, 255, 255, .14); }
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--orange); border-color: var(--orange); box-shadow: 0 8px 22px rgba(255, 85, 0, .3); }
.btn.primary:hover { background: #ff6a1f; }
.btn.icon { width: 42px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; }
@media (max-width: 700px) {
  .dock { padding: 16px 16px 18px; gap: 16px; }
  .group { width: 100%; }
  .seg { width: 100%; } .seg button { flex: 1; padding-inline: 6px; }
  #shapeSeg button span { display: none; }
  .actions { justify-content: space-between; padding-top: 0; border-top: 0; } .actions .btn { flex: 1; justify-content: center; padding: 0 10px; } .actions .btn.icon { flex: none; }
  .stage { border-radius: 22px; }
}
</style>

        <button class="btn icon primary" id="autoBtn" aria-label="Keep drawing" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg></button>
        <button class="btn icon" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2v3.5H6"/></svg></button>
      </div>
    </div>
  </main>
</div>

<script>
// Central Limit Theorem: everything moves on one canvas, driven by time (no CSS transitions), so it stays smooth at any speed.
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const io = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const CREAM = '#f8f8f2', ORANGE = '255,85,0', QUIET = 'rgba(169,198,202,', FONT = '"Atkinson Hyperlegible", system-ui, sans-serif', NUM = 'Outfit, system-ui, sans-serif';

// ---- populations on 0..100: a pdf on a grid, its CDF for sampling, and its true mean and SD ----
const N = 400;
const gauss = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s));
const gam = (x, k, th) => x <= 0 ? 0 : x ** (k - 1) * Math.exp(-x / th);
// every population has a round mean (50, 30 or 70) so μ sits in the middle of a pile column
const truncMean = f => { let a = 0, m = 0; for (let i = 0; i <= 2000; i++) { const x = i / 20, y = f(x); a += y; m += y * x; } return m / a; };
const SKEW = (() => { let lo = 5, hi = 40; for (let i = 0; i < 50; i++) { const th = (lo + hi) / 2; if (truncMean(x => gam(x, 2, th)) < 30) lo = th; else hi = th; } return (lo + hi) / 2; })();
const SHAPES = [
  { label: 'Uniform', f: () => 1 },
  { label: 'Normal', f: x => gauss(x, 50, 15) },
  { label: 'Right-skewed', f: x => gam(x, 2, SKEW) },
  { label: 'Left-skewed', f: x => gam(100 - x, 2, SKEW) },
  { label: 'Two peaks', f: x => gauss(x, 25, 8) + gauss(x, 75, 8) }
];
SHAPES.forEach(s => {
  const raw = Array.from({ length: N + 1 }, (_, i) => s.f(100 * i / N)), mx = Math.max(...raw);
  s.ys = raw.map(y => y / mx);
  let tot = 0, m = 0, m2 = 0; s.cdf = [0];
  for (let i = 1; i <= N; i++) { const a = (s.ys[i - 1] + s.ys[i]) / 2, x = 100 * (i - .5) / N; tot += a; m += a * x; m2 += a * x * x; s.cdf.push(tot); }
  s.cdf = s.cdf.map(c => c / tot); s.mu = m / tot; s.sd = Math.sqrt(m2 / tot - s.mu ** 2);
});
function sample(s) {
  const u = Math.random(); let lo = 0, hi = N;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (s.cdf[mid] < u) lo = mid; else hi = mid; }
  return 100 * (lo + (u - s.cdf[lo]) / ((s.cdf[hi] - s.cdf[lo]) || 1)) / N;
}
const NS = [1, 5, 30, 100];

// ---- state ----
let shape = SHAPES[2], n = 30;
let popFrom = shape.ys, muFrom = shape.mu, popT0 = -1e9;
let BW = 2, BINS = 51, means = [], counts = [], flash = [], unit = 0;
let flights = [], ripples = [], queue = 0, k = 0, nextAt = 0, auto = false, drain = null;
let W = 0, H = 0, L = {};
const X = v => L.x0 + (L.x1 - L.x0) * v / 100;
// bins are centred on round numbers (every 2 on wide screens, every 2.5 on phones), so they line up with the axis labels
const binOf = m => Math.min(BINS - 1, Math.max(0, Math.round(m / BW)));
const binX = b => X(b * BW);
const bw = () => (L.x1 - L.x0) * BW / 100;

function rebin() { counts = new Array(BINS).fill(0); flash = new Array(BINS).fill(0); means.forEach(m => counts[binOf(m)]++); }
function layout() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = W < 560 ? 16 : 34, narrow = W < 560;
  L = { x0: pad, x1: W - pad, popTop: 78, popBase: Math.round(H * .3) + 30, narrow };
  L.gatherY = L.popBase + Math.round(H * .085); L.pileLabel = L.gatherY + 34; L.pileTop = L.pileLabel + 34; L.base = H - 34;
  L.bead = narrow ? 5 : 7;
  const w = narrow ? 2.5 : 2; if (w !== BW || !counts.length) { BW = w; BINS = 100 / w + 1; rebin(); unit = 0; }
  if (!unit) unit = bw();
}

// ---- the population curve morphs when you switch shapes ----
const popT = now => io(cl((now - popT0) / 560));
const popYs = now => { const t = popT(now); return t >= 1 ? shape.ys : shape.ys.map((y, i) => lerp(popFrom[i], y, t)); };

// ---- one sample: n dots pop up on the population line, drop together to the mixing line, slide together into their mean, and the mean drops onto the pile ----
// at normal speed every step gets a short pause, so you can follow it: dots appear one by one, drop, slide into the labelled average, hold, then the average drops
const POP = 450, FALL0 = 700, FALL1 = 980, SLIDE0 = 1150, SLIDE1 = 1750, DROP = 2150;
function spawn(now, speed) {
  const vals = Array.from({ length: n }, () => sample(shape)), mean = vals.reduce((a, b) => a + b, 0) / n;
  const parts = vals.map((v, i) => ({ x: X(v), d: (n > 1 ? i / (n - 1) : 0) * POP }));
  flights.push({ t0: now, s: speed, parts, mean, mx: X(mean), label: speed < 2.2, D: 260 + 160 * (L.base - L.gatherY) / H });
}
function partPos(p, f, t) {
  const fall = cl((t - FALL0) / (FALL1 - FALL0)), u = cl((t - SLIDE0) / (SLIDE1 - SLIDE0));
  const y = lerp(L.popBase, L.gatherY, fall * fall), x = lerp(p.x, f.mx, io(u));
  return [x, y, 1 - .4 * io(u), u, fall];
}
const landY = b => L.base - counts[b] * unit - unit / 2;

function schedule(now) {
  if (auto && queue === 0) queue = 1;
  while (queue > 0 && now >= nextAt) {
    // the first sample of a click plays at full length on its own; the rest of a batch speeds up
    spawn(now, RM ? 6 : k === 0 ? 1 : Math.min(6, 1.6 + k * .5)); queue--; k++;
    nextAt = now + (RM ? 40 : k === 1 ? 2300 : Math.max(60, 700 * Math.pow(.78, k)));
  }
  if (!queue && !auto && !flights.length) k = 0;   // next click starts calm again
}
function update(now, dt) {
  for (const f of flights) {
    const t = (now - f.t0) * f.s;
    if (t >= DROP + f.D) {
      const b = binOf(f.mean); counts[b]++; means.push(f.mean); flash[b] = 1;
      ripples.push({ x: binX(b), y: landY(b) + unit / 2, t0: now }); f.done = true;
    }
  }
  flights = flights.filter(f => !f.done);
  ripples = ripples.filter(r => now - r.t0 < 480);
  // leave room for the peak of the normal curve as well as the tallest column
  const peak = means.length >= 12 ? means.length * BW / (shape.sd / Math.sqrt(n) * Math.sqrt(2 * Math.PI)) : 0;
  const target = Math.min(bw(), (L.base - L.pileTop) / (Math.max(1, peak, ...counts) + .6));
  unit += (target - unit) * (1 - Math.exp(-dt / 150));
  for (let i = 0; i < BINS; i++) flash[i] *= Math.exp(-dt / 300);
  if (drain && now - drain.t0 > 380) drain = null;
  return Math.abs(target - unit) > .05;
}

// ---- drawing ----
const note = (s, x, y) => txt(s, x, y, `400 13px ${FONT}`, 'rgba(213,228,230,.78)');
function txt(s, x, y, font, color, align = 'left') { g.font = font; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y); }
function caption(label, x, y) { g.save(); if ('letterSpacing' in g) g.letterSpacing = '2px'; txt(label, x, y, `700 11px ${FONT}`, `rgb(${ORANGE})`); g.restore(); }

function drawPile(cnt, u, alpha, fl) {
  const w = bw(), cw = Math.max(1.5, w - (L.narrow ? 1.5 : 2.5));
  for (let b = 0; b < BINS; b++) {
    const c = cnt[b]; if (!c) continue;
    const x = binX(b) - cw / 2, f = fl ? fl[b] : 0;
    g.fillStyle = `rgba(${Math.round(lerp(255, 255, f))},${Math.round(lerp(85, 190, f))},${Math.round(lerp(0, 140, f))},${alpha * .92})`;
    g.beginPath();
    if (u >= 4) {   // beads while there is room, squeezing into a solid bar as the pile grows
      const gap = Math.min(1.6, (u - 3) * .45), h = u - gap, r = Math.min(cw, h) / 2;
      for (let i = 0; i < c; i++) g.roundRect(x, L.base - (i + 1) * u + gap / 2, cw, h, r);
    } else g.roundRect(x, L.base - c * u, cw, c * u, [Math.min(cw / 2, 3), Math.min(cw / 2, 3), 0, 0]);
    g.fill();
  }
}

function render(now) {
  g.clearRect(0, 0, W, H);
  const ys = popYs(now), pt = popT(now), mu = lerp(muFrom, shape.mu, pt), hgt = L.popBase - L.popTop;

  // population
  caption('POPULATION', L.x0, 30);
  const vals = n === 1 ? 'one random value' : `${n} random values`;
  note(L.narrow ? `Each sample picks ${vals} from here` : `All the values we can pick from. Each sample picks ${vals} from here.`, L.x0, 50);
  g.beginPath(); g.moveTo(X(0), L.popBase);
  for (let i = 0; i <= N; i += 2) g.lineTo(X(100 * i / N), L.popBase - ys[i] * hgt);
  g.lineTo(X(100), L.popBase); g.closePath();
  const grad = g.createLinearGradient(0, L.popTop, 0, L.popBase); grad.addColorStop(0, 'rgba(131,172,178,.42)'); grad.addColorStop(1, 'rgba(131,172,178,.06)');
  g.fillStyle = grad; g.fill();
  g.beginPath(); for (let i = 0; i <= N; i += 2) g[i ? 'lineTo' : 'moveTo'](X(100 * i / N), L.popBase - ys[i] * hgt);
  g.strokeStyle = CREAM; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(L.x0, L.popBase, L.x1 - L.x0, 1);

  // the true mean runs through every layer
  g.save(); g.setLineDash([3, 5]); g.strokeStyle = `rgba(${ORANGE},.5)`; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(X(mu), L.popTop - 8); g.lineTo(X(mu), L.base); g.stroke(); g.restore();
  txt('μ', X(mu) + 6, L.popTop + 4, `italic 700 13px ${FONT}`, `rgb(${ORANGE})`, 'left');

  // mixing line
  g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(L.x0, L.gatherY, L.x1 - L.x0, 1);

  // pile of means
  caption('SAMPLE MEANS', L.x0, L.pileLabel);
  note(L.narrow ? 'Each dot is the average of one sample' : 'Each dot is the average of one sample. Keep drawing and watch them pile up into a bell shape.', L.x0, L.pileLabel + 20);
  if (drain) { const f = 1 - io(cl((now - drain.t0) / 380)); drawPile(drain.counts, drain.unit * f, f, null); }
  drawPile(counts, unit, 1, flash);

  // the normal curve the CLT predicts, fading in once there is something to compare
  if (means.length >= 12) {
    const a = cl((means.length - 12) / 25), s = shape.sd / Math.sqrt(n), scale = means.length * BW * unit / (s * Math.sqrt(2 * Math.PI));
    g.save(); g.globalAlpha = a; g.beginPath(); let first = true;
    for (let i = 0; i <= 300; i++) { const v = 100 * i / 300, y = L.base - scale * gauss(v, shape.mu, s); if (y > L.base - .5 && !first) { g.lineTo(X(v), L.base); continue; } g[first ? 'moveTo' : 'lineTo'](X(v), Math.max(L.pileTop - 10, y)); first = false; }
    g.strokeStyle = CREAM; g.lineWidth = 2; g.setLineDash([6, 5]); g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 6; g.stroke();
    const lx = Math.min(97, shape.mu + 1.3 * s), ly = Math.max(L.pileTop + 4, L.base - scale * gauss(lx, shape.mu, s));
    g.setLineDash([]); g.shadowBlur = 0;
    txt('normal curve', X(lx) + 8, ly - 6, `700 11px ${FONT}`, 'rgba(248,248,242,.8)', X(lx) + 90 > L.x1 ? 'right' : 'left');
    g.restore();
  }

  // axis
  g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(L.x0, L.base, L.x1 - L.x0, 1.2);
  for (let v = 0; v <= 100; v += L.narrow ? 25 : 10) txt(String(v), X(v), L.base + 20, `500 11px ${NUM}`, QUIET + '.7)', v === 0 ? 'left' : v === 100 ? 'right' : 'center');

  // flights
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const f of flights) {
    const t = (now - f.t0) * f.s; let absorbed = 0;
    for (const p of f.parts) {
      if (t < p.d) continue;
      const [x, y, sc, u] = partPos(p, f, t); if (u >= 1) { absorbed++; continue; }
      const pop = back(cl((t - p.d) / 170)) * sc;
      if (u > 0 || t > FALL0) { const [x2, y2] = partPos(p, f, t - 40 * f.s); g.strokeStyle = 'rgba(248,240,225,.22)'; g.lineWidth = 2.2 * sc; g.beginPath(); g.moveTo(x2, y2); g.lineTo(x, y); g.stroke(); }
      g.fillStyle = 'rgba(255,236,215,.16)'; g.beginPath(); g.arc(x, y, 6.5 * pop, 0, 7); g.fill();
      g.fillStyle = '#fff6ea'; g.beginPath(); g.arc(x, y, 2.6 * pop, 0, 7); g.fill();
    }
    const b = binOf(f.mean), p = cl((t - DROP) / f.D), pe = p * p;
    if (f.label && t > SLIDE0 - 150 && p < .35) {   // the average is marked before the dots slide into it
      g.globalCompositeOperation = 'source-over';
      const a = cl((t - SLIDE0 + 150) / 250) * (1 - p / .35);
      g.fillStyle = `rgba(${ORANGE},${a * (absorbed === f.parts.length ? 0 : .9)})`; g.fillRect(f.mx - 1, L.gatherY - 8, 2, 16);
      txt(`average ${f.mean.toFixed(1)}`, f.mx, L.gatherY - 16, `700 12.5px ${FONT}`, `rgba(248,248,242,${a})`, 'center');
      g.globalCompositeOperation = 'lighter';
    }
    if (!absorbed) continue;
    const r0 = L.bead * (.45 + .55 * Math.sqrt(absorbed / f.parts.length)), r = lerp(r0, Math.min(bw() - 2, unit) / 2, pe);
    const y = p > 0 ? lerp(L.gatherY, landY(b), pe) : L.gatherY;
    const glow = p > 0 ? 1 - p * .6 : 1, bx = lerp(f.mx, binX(b), io(p));   // drifts onto its column while it falls
    g.fillStyle = `rgba(${ORANGE},${.22 * glow})`; g.beginPath(); g.arc(bx, y, r * 2.6, 0, 7); g.fill();
    g.fillStyle = `rgb(${ORANGE})`; g.beginPath(); g.arc(bx, y, r, 0, 7); g.fill();
  }
  g.restore();
  for (const r of ripples) {
    const t = (now - r.t0) / 480, e = 1 - Math.pow(1 - t, 3);
    g.strokeStyle = `rgba(${ORANGE},${.55 * (1 - t)})`; g.lineWidth = 1.5; g.beginPath(); g.arc(r.x, r.y, 3 + 16 * e, 0, 7); g.stroke();
  }
}

// ---- loop: runs only while something is moving ----
let running = false, last = 0;
function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  schedule(now);
  const settling = update(now, dt);
  render(now);
  const busy = queue > 0 || auto || flights.length || ripples.length || drain || now - popT0 < 600 || settling || flash.some(f => f > .01);
  if (busy) requestAnimationFrame(frame); else running = false;
}

// ---- controls ----
function clearPile(now = performance.now()) {
  if (means.length) drain = { counts: counts.slice(), unit, t0: now };
  means = []; flights = []; ripples = []; queue = 0; k = 0; rebin(); unit = bw();
}
function setAuto(on) { auto = on; const b = document.getElementById('autoBtn'); b.setAttribute('aria-pressed', on);
  b.innerHTML = on ? '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>'
                   : '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
  b.setAttribute('aria-label', on ? 'Pause' : 'Keep drawing'); if (!on) queue = 0; kick(); }

function moveInd(seg) {
  const on = seg.querySelector('[aria-pressed="true"]'), ind = seg.querySelector('.ind');
  ind.style.width = on.offsetWidth + 'px'; ind.style.transform = `translateX(${on.offsetLeft}px)`;
}
function buildSeg(seg, items, current, onPick) {
  items.forEach((it, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.innerHTML = it.html; b.setAttribute('aria-pressed', i === current);
    if (it.label) b.setAttribute('aria-label', it.label);
    b.addEventListener('click', () => { if (b.getAttribute('aria-pressed') === 'true') return; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); moveInd(seg); onPick(i); });
    seg.appendChild(b);
  });
}
const icon = s => { let d = ''; for (let i = 0; i <= N; i += 10) d += (i ? 'L' : 'M') + (28 * i / N).toFixed(1) + ',' + (13 - 11 * s.ys[i]).toFixed(1);
  return `<svg viewBox="0 0 28 14" aria-hidden="true"><path d="${d}L28,13L0,13Z" fill="currentColor" opacity=".25"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`; };
const shapeSeg = document.getElementById('shapeSeg'), nSeg = document.getElementById('nSeg');
buildSeg(shapeSeg, SHAPES.map(s => ({ html: icon(s) + `<span>${s.label}</span>`, label: s.label })), SHAPES.indexOf(shape), i => {
  const now = performance.now(); popFrom = popYs(now); muFrom = lerp(muFrom, shape.mu, popT(now)); popT0 = now;
  shape = SHAPES[i]; clearPile(now); kick();
});
buildSeg(nSeg, NS.map(v => ({ html: String(v), label: 'n = ' + v })), NS.indexOf(n), i => { n = NS[i]; clearPile(); kick(); });
document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
  if (!queue && !flights.length) nextAt = performance.now();
  queue = Math.min(400, queue + Number(b.dataset.k)); kick();
}));
document.getElementById('autoBtn').addEventListener('click', () => setAuto(!auto));
document.getElementById('resetBtn').addEventListener('click', () => { setAuto(false); clearPile(); kick(); });

// the canvas takes whatever height is left, so the whole tool always fits on screen without scrolling
function fit() {
  const top = cv.getBoundingClientRect().top + scrollY, dock = document.querySelector('.dock').offsetHeight;
  cv.style.height = Math.round(Math.max(260, Math.min(700, innerHeight - top - dock - 3 - 16))) + 'px';
}
const relayout = () => { fit(); layout(); moveInd(shapeSeg); moveInd(nSeg); kick(); };
addEventListener('resize', relayout);
relayout();
document.fonts && document.fonts.ready.then(relayout);
</script>
</body>
</html>
