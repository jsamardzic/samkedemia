<style>
    :root {
        --teal: #0C3840;
        --cream: #F8F8F2;
        --orange: #FF5500;
        --line: rgba(248, 248, 242, .16);
        --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-title: 'Vidaloka', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #0C3840; }
    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: max(40px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        font-family: var(--font-body);
        color: var(--cream);
        /* Same background as the tools and the 404 page: spotlight (body::before) and icon pattern (body::after). */
        background-color: transparent;
    }
    body::before, body::after { content: ""; position: fixed; pointer-events: none; }
    body::before {
        inset: 0; z-index: -2;
        background: radial-gradient(ellipse 85% 55% at 50% 55%, #1A606C 0%, #0C3840 52%, #051619 100%);
    }
    body::after {
        left: 50%; top: 50%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax; z-index: -1;
        background: url("images/pattern-teal.svg") 0 0 / clamp(300px, 52vw, 560px) auto;
        transform: rotate(-15deg); opacity: .055;
    }
    main { width: 100%; max-width: 400px; }
    .logo { display: block; width: min(62%, 210px); height: auto; margin: 0 auto 44px; }
    .links { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .links li { border-bottom: 1px solid var(--line); }
    .link {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 88px;
        padding: 16px 2px;
        text-decoration: none;
        color: var(--cream);
        -webkit-tap-highlight-color: transparent;
    }
    .link:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
    .text { flex: 1 1 auto; min-width: 0; }
    .title { display: block; font-family: var(--font-title); font-size: 1.5rem; line-height: 1.2; transition: color .15s ease; }
    .sub { display: block; margin-top: 4px; font-size: .95rem; line-height: 1.35; opacity: .72; }
    .arrow { flex: 0 0 auto; width: 20px; height: 20px; color: var(--orange); transition: transform .15s ease; }
    .link:active .title { color: var(--orange); }
    @media (hover: hover) {
        .link:hover .title { color: var(--orange); }
        .link:hover .arrow { transform: translateX(4px); }
    }
    @media (prefers-reduced-motion: reduce) { .title, .arrow { transition: none; } }
</style>
