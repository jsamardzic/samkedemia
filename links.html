<style>
    :root { --teal:#0C3840; --teal-mid:#2f6a73; --cream:#F8F8F2; --orange:#FF5500; --font-body:'Bricolage Grotesque',system-ui,sans-serif; --font-title:'Vidaloka',Georgia,serif; }

<script>
(function() {
    const root = document.documentElement;
    if (!root.classList.contains('pat-intro')) return;
    const box = document.querySelector('.pat'), drift = box.querySelector('.pat-drift'), logoEl = document.querySelector('.logo');
    const NS = 'http://www.w3.org/2000/svg';
    function reveal() { root.classList.remove('pat-intro'); }
    function endLogo() { root.classList.remove('pat-logo'); const o = document.getElementById('logo-intro'); if (o) o.remove(); }
    function bail() { reveal(); endLogo(); }
    if (!window.fetch || !window.DOMParser) { bail(); return; }
    // pieces of the pattern that fade in (confetti) instead of being drawn
    const FADE = new Set([458,459,460,461,462,463,464,465,466,467,468,469,470,471,472,473,474,475,476,477,478,479,480,481,482,483,484,485,486,487,488,489,490,491,492,493,494,495,496,497,498,499,500,501,502,503,504,505,506,507,508,509,510,511,512,513,514,515,516,517,518,519,520,521,522,523,524,525,526,527,528,529,530,531,532,533,534,535,536,537,538,539,540,541,542,543,544,545,546,547,548,549,550,551,552,553,554,555,556,557,558,559,560,561,562,563,564,565,566,567,568,569,570,571,572,573,574,575,576,577,578,579,580,581,582,583,584,585,586,587,588,589,590,591,592,593,594,595,596,597,598,599,600,601,602]);
    const START = 0.05, SWEEP = 0.5, JITTER = 0.2, GLIDE_AT = 1500, GLIDE = 700;
    drift.classList.add('writing');
    const giveUp = setTimeout(bail, 2500);
    Promise.all([fetch('images/math-pattern-light.svg').then(r => r.text()), fetch('images/logo-cream.svg').then(r => r.text())]).then(function(res) {
        clearTimeout(giveUp);
        const parse = t => new DOMParser().parseFromString(t, 'image/svg+xml').documentElement;

        /* ---- the math draws itself ---- */
        const src = parse(res[0]), VB = 1650;
        const b = box.getBoundingClientRect();
        const tile = drift.getBoundingClientRect().width - b.width;
        const cols = Math.ceil((b.width + 40) / tile), rows = Math.ceil(b.height / tile);
        const spanX = cols * VB, spanY = rows * VB;
        const all = Array.from(src.querySelectorAll('path'));
        const fPaths = all.filter((p, k) => !FADE.has(k)), rPaths = all.filter((p, k) => FADE.has(k));
        const starts = fPaths.map(p => { const m = /M\s*([\d.-]+)[\s,]+([\d.-]+)/.exec(p.getAttribute('d') || ''); return m ? [+m[1], +m[2]] : [0, 0]; });
        const layerF = document.createElement('div'), layerR = document.createElement('div');
        layerF.className = 'pat-layer pat-f'; layerR.className = 'pat-layer pat-r';
        drift.appendChild(layerR); drift.appendChild(layerF);
        function tileSvg(i, j) { const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 ' + VB + ' ' + VB); svg.style.left = (i * tile) + 'px'; svg.style.top = (j * tile) + 'px'; return svg; }
        const lens = [], jobs = [], k2px = tile / VB, PAD = 420;
        const fJobs = [], rJobs = [];
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
            const skipped = [];
            fJobs.push(function(late) {
                const sf = tileSvg(i, j), kept = [];
                fPaths.forEach(function(p, k) {
                    const px = i * tile + starts[k][0] * k2px, py = j * tile + starts[k][1] * k2px;
                    if (px < -PAD * k2px || py < -PAD * k2px || px > b.width + 40 || py > b.height) { skipped.push(p); return; }
                    kept.push(k);
                    const c = p.cloneNode(false);
                    const gx = i * VB + starts[k][0], gy = j * VB + starts[k][1];
                    c.style.setProperty('--d', (START + SWEEP * (0.6 * gx / spanX + 0.4 * gy / spanY) + Math.random() * JITTER - late).toFixed(3) + 's');
                    sf.appendChild(c);
                });
                layerF.appendChild(sf);
                Array.from(sf.children).forEach(function(c, n) { const k = kept[n]; if (lens[k] == null) lens[k] = Math.ceil(c.getTotalLength ? c.getTotalLength() : 4000) + 1; c.style.setProperty('--len', lens[k]); });
            });
            rJobs.push(function() { const sr = tileSvg(i, j); rPaths.concat(skipped).forEach(p => sr.appendChild(p.cloneNode(false))); layerR.appendChild(sr); });
        }
        jobs.push.apply(jobs, fJobs.concat(rJobs));
        const t0 = performance.now(); let q = 0;
        (function next() { if (q >= jobs.length) return; jobs[q++]((performance.now() - t0) / 1000); requestAnimationFrame(next); })();

        /* ---- the logo sketches itself in the middle ---- */
        const lg = parse(res[1]), vb = lg.getAttribute('viewBox').split(/\s+/).map(Number);
        const colors = { st0: '#FF5500', st1: '#F7F7F1', st2: '#FFFFFF', st3: '#F8F8F2', st4: '#FF5500' };
        const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', vb.join(' '));
        lg.querySelectorAll('path').forEach(function(p) {
            const c = colors[p.getAttribute('class')] || '#F8F8F2', q2 = p.cloneNode(false);
            q2.removeAttribute('class'); q2.setAttribute('fill', c); q2.setAttribute('stroke', c); q2.setAttribute('stroke-width', '1'); q2.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(q2);
        });
        const lbox = document.createElement('div'); lbox.id = 'logo-intro'; lbox.appendChild(svg);
        const W0 = Math.min(innerWidth * 0.74, 460), H0 = W0 * vb[3] / vb[2];
        const x0 = (innerWidth - W0) / 2, y0 = (innerHeight - H0) / 2 - innerHeight * 0.04;
        lbox.style.width = W0 + 'px'; lbox.style.transform = 'translate(' + x0 + 'px,' + y0 + 'px)';
        document.body.appendChild(lbox);
        Array.from(svg.children).forEach(function(p) { const bb = p.getBBox(); p.style.setProperty('--len', Math.ceil(p.getTotalLength()) + 1); p.style.setProperty('--d', (0.1 + 0.5 * (bb.x - vb[0]) / vb[2]).toFixed(2) + 's'); });

        /* ---- timeline ---- */
        setTimeout(function() { drift.classList.add('settled'); }, GLIDE_AT - 300);          // confetti fades in once the drawing is done
        setTimeout(function() {
            const t = logoEl.getBoundingClientRect();
            const sc = t.width / W0;   // scale on the GPU (a width animation re-lays-out and repaints the logo every frame)
            const a = lbox.animate([
                { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1)' },
                { transform: 'translate(' + t.left + 'px,' + t.top + 'px) scale(' + sc + ')' }
            ], { duration: GLIDE, easing: 'cubic-bezier(0.65, 0, 0.25, 1)', fill: 'forwards' });
            setTimeout(reveal, 450);                                                           // the rest rises in mid-glide
            a.onfinish = function() { endLogo(); };                                            // one-frame swap to the real logo
        }, GLIDE_AT);
        // keep the drawn pattern; quietly add the off-screen tiles the drift will need
        setTimeout(function() {
            const allCols = Math.ceil(drift.getBoundingClientRect().width / tile), allRows = Math.ceil(drift.getBoundingClientRect().height / tile), extra = [];
            for (let j = 0; j < allRows; j++) for (let i = 0; i < allCols; i++) { if (i < cols && j < rows) continue; extra.push(function() { const sv = tileSvg(i, j); all.forEach(p => sv.appendChild(p.cloneNode(false))); layerR.appendChild(sv); }); }
            (function step() { if (extra.length) { extra.shift()(); requestAnimationFrame(step); } })();
            const w0 = b.width, h0 = b.height;
            window.addEventListener('resize', function swap() {
                const r = box.getBoundingClientRect();
                if (r.width <= w0 + 1 && r.height <= h0 + 1) return;
                window.removeEventListener('resize', swap);
                drift.classList.remove('writing', 'settled'); drift.querySelectorAll('.pat-layer').forEach(n => n.remove());   // fall back to the plain tile
            });
        }, 3200);
    }).catch(bail);
})();
