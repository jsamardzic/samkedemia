        background-size: 220px 220px;
    }
    body::before, body::after { content: ""; position: fixed; pointer-events: none; }
    body::before {
        inset: 0; z-index: -2;
        background: radial-gradient(ellipse 85% 55% at 50% 55%, #FFFFFF 0%, #F8F8F2 38%, #E3DDD3 72%, #C9C1B5 100%);

    body::after {

    .avatar img { display: block; width: 82%; height: auto; }
    .links { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
    .link {

        display: flex;

        gap: 14px;
        min-height: 68px;
        padding: 14px 18px;
        border-radius: 20px;
        text-align: left;
        text-decoration: none;
        color: var(--teal);

    }
    .link.primary { background: var(--teal); border-color: var(--teal); color: var(--cream); }
    .link.whatsapp { background: #25D366; border-color: #25D366; color: var(--teal); }
    .icon.fill { fill: currentColor; stroke: none; }
    .link:active { transform: scale(.98); }
    .link:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
    @media (hover: hover) {
        .link:hover { background: #fff; border-color: var(--teal); }
        .link.primary:hover { background: var(--teal-light); border-color: var(--teal-light); }
        .link.whatsapp:hover { background: #3be07b; border-color: #3be07b; }
    }
    .icon { flex: 0 0 auto; width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .text { flex: 1 1 auto; min-width: 0; }

    .arrow { flex: 0 0 auto; width: 20px; height: 20px; opacity: .8; }
    .badge {

        font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    }
    @media (max-width: 360px) {
        .link { padding: 12px 14px; gap: 12px; }
        .title { font-size: 1rem; }
    }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
