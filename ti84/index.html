  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden}
#calc{position:absolute;left:0;top:0;width:438px;height:1018px;transform-origin:0 0}
#rails{position:absolute;left:0;right:0;top:552px;bottom:0;border-radius:22px 22px 46px 46px;
  background:linear-gradient(90deg,#5d5d5d 0,#c4c4c4 1.4%,#a9a9a9 2.4%,#6a6a6a 3%,#6a6a6a 97%,#a9a9a9 97.6%,#c4c4c4 98.6%,#5d5d5d 100%)}
#rails::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:14px;border-radius:0 0 40px 40px;

#body{position:absolute;left:0;top:0;width:438px;height:1018px;border-radius:44px 44px 36px 36px;

.title{left:0;right:0;text-align:center;color:#f4f4f4;font:700 18px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.2px}
.title .tx span{font-weight:400}
.ti{left:0;right:0;text-align:center;color:#ededed;font:600 13px/1 Georgia,"Times New Roman",serif;letter-spacing:.6px;font-variant:small-caps}

  font:700 15px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.1px;
  background:linear-gradient(#303030,#141414 55%,#0f0f0f);

  transition:transform .04s}
.key.down{transform:translateY(1.5px);box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 0 0 #000}
.key.light{color:#111;background:linear-gradient(#f5f6f6,#dcdede 60%,#cfd1d1);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.12),0 2px 0 #7e8080,0 3px 5px rgba(0,0,0,.5)}
.key.light.down{box-shadow:inset 0 1px 3px rgba(0,0,0,.35),0 0 0 #000}
.key.fn{font-size:13.5px;letter-spacing:-.1px;border-radius:7px}
.key.num{font-size:29px;border-radius:8px}
.key.op{font-size:30px;font-weight:600;border-radius:8px}
.key.sm{font-size:14px}
.key.xt{font-size:12.5px;letter-spacing:0}
.key.k2nd{background:linear-gradient(#93d4f4,#6cbde8 60%,#5cb2e0);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #2a6d93,0 3px 5px rgba(0,0,0,.55)}
.key.kalpha{background:linear-gradient(#b8dc60,#9cc842 60%,#8dba35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 #4f6f18,0 3px 5px rgba(0,0,0,.55)}
.key sup{font-size:.62em;line-height:0;vertical-align:.62em}
.key i{font-style:italic}
/* key labels: blue (2nd) hugs the key's left edge, green (alpha) its right edge; an empty side stays empty.

.lb{display:flex;gap:6px;width:max-content;transform:translateX(-50%);height:14px;font:700 12px/14px "Helvetica Neue",Arial,sans-serif;white-space:nowrap;pointer-events:none}
.lb .b{color:var(--blue);flex:none} .lb .g{color:var(--green);margin-left:auto;flex:none}
.lb svg{display:block}
.lb sup{font-size:.7em;line-height:0;vertical-align:.5em}
.key.fnsm{font-size:11.5px}
.key.neg{font-size:23px;font-weight:600;letter-spacing:.5px}
#dpad path.pet{fill:url(#petg);cursor:pointer}
#dpad path.pet.down{fill:#bfc2c2}
/* ---- key highlight (visible on screen share) ---- */
.key::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 0 0 3px #ffd54a,0 0 16px 5px rgba(255,213,74,.75)}
.key.hl::after{animation:hlfade .9s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes hlfade{0%{opacity:1}22%{opacity:.95}100%{opacity:0}}
.key.armed{box-shadow:0 0 0 3px #fff,0 0 14px 4px rgba(255,255,255,.55)!important}
#dpad path.pet{transition:fill .7s cubic-bezier(.2,.6,.3,1)}
#dpad path.pet.hl{fill:#ffd54a;transition:none}

#shots{position:absolute;left:50px;top:946px;z-index:5}
#shots button{all:unset;box-sizing:border-box;width:48px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(30,32,37,.92);border:1px solid #3a3e46;color:#d5d8dd;box-shadow:0 4px 14px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}
#shots button:hover{background:#2b2f36;color:#fff} #shots button:active{transform:scale(.94)}
#shots svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);z-index:6;padding:10px 16px;border-radius:10px;background:rgba(20,22,26,.96);
  border:1px solid #3a3e46;color:#eef0f3;font:600 13px/1 "Helvetica Neue",Arial,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- model switch (click the name) ---- */
#stage{transition:opacity .14s ease,transform .14s ease}
#stage.swap{opacity:0;transform:scale(.965)}
.title{pointer-events:none;display:flex;justify-content:center;align-items:center;height:34px}
.tt{pointer-events:auto;cursor:pointer;position:relative;display:block;padding:7px 34px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);transition:background .15s,border-color .15s;white-space:nowrap}
.tt:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.34)}
.tt:active{transform:scale(.97)}
.tt svg{position:absolute;right:11px;top:50%;margin-top:-6px;width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.6;transition:opacity .15s}
.tt:hover svg{opacity:1}
#hw84,#lcdfx{display:none;left:0;top:0;pointer-events:none}
#hw84{width:100%;height:100%}
#hw84 svg{display:block}
#lcdfx{width:320px;height:240px;box-shadow:inset 0 0 0 1px rgba(20,24,14,.55),inset 0 0 16px rgba(30,40,20,.28)}

  sel:0, c:0, fresh:true, toks:WFIELDS.map(() => []),
  enter() { this.toks.forEach((t, i) => t.splice(0, t.length, ...[...fmt(WIN[WFIELDS[i][1]])])); this.c = this.toks[this.sel].length; this.fresh = true; },
  leave() {

      const w = Object.assign({}, WIN, { [k]:v });
      if (w.xmin >= w.xmax || w.ymin >= w.ymax) err('WINDOW RANGE');

  key(a) {

/* ---- TBLSET ---- */
const tblsetScr = {
  sel:0, c:0, fresh:true, opt:0,
  f:[{ k:'start', lab:'TblStart=', t:[] }, { k:'step', lab:'ΔTbl=', t:[] }],
  enter() { this.f.forEach(f => f.t = [...fmt(TBL[f.k])]); this.sel = 0; this.c = this.f[0].t.length; this.fresh = true; },
  commit() {

    const f = this.f[this.sel];
    try { const v = evaluate(f.t).v; if (f.k === 'step' && v === 0) err('DOMAIN'); TBL[f.k] = v; } catch (e) { isCalcErr(e); }

  leave() { this.commit(); },
  key(a) {

      this.commit(); this.sel = Math.max(0, Math.min(3, this.sel + (a === '@up' ? -1 : 1)));
      this.c = this.sel < 2 ? this.f[this.sel].t.length : 0; this.fresh = true;

    }
    if (this.sel > 1) {

/* ---- TABLE ---- */
const tableScr = {
  canvas:true, r:0, c:0, coff:0, base:0, xs:[], inp:null, shown:new Set(),
  enter() { this.base = TBL.start; this.r = 0; this.c = 0; this.coff = 0; this.inp = null; },
  hint() { return 'PRESS + FOR ΔTbl'; },
  cols() { return [-1, ...activeFns()]; },
  xAt(r) { return TBL.indpnt === 'Ask' ? this.xs[r] : Number((this.base + r * TBL.step).toPrecision(12)); },
  yShown(fi, x) { return TBL.depend === 'Auto' || this.shown.has(fi + ':' + x); },
  key(a) {
    const cols = this.cols();
    this.c = Math.min(this.c, cols.length - 1);
    if (this.inp !== null) {
      if (a === '@enter') {
        const t = this.inp; this.inp = null; if (!t.length) return;
        try { const v = evaluate(t).v; this.xs[this.r] = v; this.xs = this.xs.filter(x => x !== undefined); if (this.r < (CL() ? R - 3 : 10)) this.r = Math.min(this.r + 1, this.xs.length); }
        catch (e) { isCalcErr(e); showError(e.message, null, this); }
        return;
      }
      if (a === '@clear') { this.inp = null; return; }
      if (a === '@del') { this.inp.pop(); return; }
      if (a[0] !== '@') this.inp.push(a);
      return;
    }
    if (a === '@up') { if (this.r > 0) this.r--; else if (TBL.indpnt === 'Auto') this.base = Number((this.base - TBL.step).toPrecision(12)); return; }
    if (a === '@down') {
      const tr = CL() ? R - 3 : 10, max = TBL.indpnt === 'Ask' ? Math.min(tr, this.xs.length) : tr;
      if (this.r < max) this.r++; else if (TBL.indpnt === 'Auto') this.base = Number((this.base + TBL.step).toPrecision(12));
      return;
    }
    if (a === '@left' || a === '@right') {
      this.c = Math.max(0, Math.min(cols.length - 1, this.c + (a === '@left' ? -1 : 1)));
      if (this.c > 0) { if (this.c - 1 < this.coff) this.coff = this.c - 1; if (this.c - 1 > this.coff + 2) this.coff = this.c - 3; }
      return;
    }
    if (a === '+') { setScreen(tblsetScr); return; }
    if (a === '@enter') { const x = this.xAt(this.r); if (this.c > 0 && x !== undefined) this.shown.add(cols[this.c] + ':' + x); return; }
    if (a === '@clear') return setScreen(home);
    if (TBL.indpnt === 'Ask' && this.c === 0) {
      if (a === '@del') { this.xs.splice(this.r, 1); return; }
      if (a[0] !== '@') { this.inp = [a]; return; }
    }
  },
  draw(g) {
    const cols = this.cols();
    this.c = Math.min(this.c, cols.length - 1);
    const vis = [0, ...cols.slice(1).map((_, i) => i + 1).slice(this.coff, this.coff + 3)];
    const CW = 80, HH = 17, RH = 15, NR = 11;
    g.fillStyle = '#d4d4d4';
    for (let r = 1; r < NR; r++) g.fillRect(0, HH + r * RH, 320, 1);
    vis.forEach((ci, k) => {
      const x0 = k * CW, fi = cols[ci], name = ci === 0 ? 'X' : 'Y' + String.fromCharCode(0x2081 + fi), selCol = ci === this.c;
      if (selCol) { g.fillStyle = '#000'; g.fillRect(x0 + 1, 0, CW - 2, HH); }
      stext(g, name, x0 + ((CW - swidth(name)) >> 1), 1, selCol ? '#fff' : ci === 0 ? '#000' : COLORS[fi]);
      for (let r = 0; r < NR; r++) {
        const x = this.xAt(r), y0 = HH + 1 + r * RH, sel = r === this.r && ci === this.c;
        let s = '';

      if (yscl > 0 && (ymax - ymin) / yscl < 300) for (let k = Math.ceil(ymin / yscl); k <= ymax / yscl; k++) { const py = Math.round(Yp(k * yscl)) + .5; g.moveTo(ox - 2.5, py); g.lineTo(ox + 2.5, py); } }
    g.stroke();
    const step = WIN.xres || 1;
    activeFns().forEach(i => {
      const f = this.fn(i);
      g.strokeStyle = COLORS[i]; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
      let pen = false, lastPy = 0;
      for (let px = 0; px <= PW; px += step) {
        const y = f(xmin + px * (xmax - xmin) / PW), py = Yp(y);
        if (!Number.isFinite(y) || Math.abs(py) > 1e5 || (pen && Math.abs(py - lastPy) > PH * 1.5)) { pen = false; continue; }
        pen ? g.lineTo(px, py) : g.moveTo(px, py); pen = true; lastPy = py;
      }
      g.stroke();
    });
    /* chosen bounds: small triangle at the top plus a dotted vertical line */
    this.marks.forEach(m => {
      const px = Math.round(X(m.x));
      g.fillStyle = COLORS[this.fi];
      for (let y = 0; y < PH; y += 3) g.fillRect(px, y, 1, 1);
      sglyph(g, m.d, m.d === '►' ? px - 7 : px + 1, -2, COLORS[this.fi]);
    });

    if (this.trace) {
      y = this.fn()(this.tx);

      if (Number.isFinite(y) && py >= -6 && py <= PH + 6 && S.blink) {   // blinking ✕ cursor
        g.fillStyle = '#000';
        for (let d = -3; d <= 3; d++) { g.fillRect(px + d, py + d, 2, 2); g.fillRect(px + d, py - d, 2, 2); }
      }
    }
    g.restore();
    if (!this.trace) return;
    lay(['Y' + String.fromCharCode(0x2081 + this.fi) + '=', ...clone(Y[this.fi])], 1, false).draw(g, PX, 14, { color:COLORS[this.fi], row:null });
    const prompt = this.calc ? PROMPTS[this.calc.type][this.calc.step] : '';
    const label = prompt || (this.result && this.result.label) || '';
    const r1 = PY + PH, r2 = r1 + 13;
    if (label) stext(g, label, PX, r1, '#000');
    if (this.inp !== null) { const end = stext(g, 'X=' + this.inp.join(''), PX, r2, COLORS[this.fi]); if (S.blink) { g.fillStyle = '#000'; g.fillRect(end, r2 + 3, 6, 10); } }
    else if (this.result && this.result.text) stext(g, this.result.text, PX, r2, COLORS[this.fi]);
    else { stext(g, 'X=' + fmtShort(this.tx, 10), PX, r2, COLORS[this.fi]); stext(g, 'Y=' + (Number.isFinite(y) ? fmtShort(y, 10) : ''), PX + 136, r2, COLORS[this.fi]); }
  }
};

/* ---- list editor (STAT ▸ EDIT ▸ 1:Edit…) ---- */
const listEd = {
  canvas:true, c:0, r:0, top:0, coff:0, inp:null,
  get name() { return LNAMES[this.c]; },
  enter() { this.inp = null; },
  clampR() { this.r = Math.min(this.r, LISTS[this.name].length); if (this.r < this.top) this.top = Math.max(0, this.r); const vr = CL() ? R - 3 : 10; if (this.r > this.top + vr) this.top = this.r - vr; },
  key(a) {

    if (this.inp !== null) {
      if (a === '@enter') {
        const t = this.inp; this.inp = null;
        if (!t.length) return;
        try {
          const v = evaluate(t).v;
          if (this.r < 0) LISTS[this.name] = isL(v) ? v.slice() : err('DATA TYPE');
          else { Ls[this.r] = needNum(v); this.r++; this.clampR(); }
        } catch (e) { isCalcErr(e); showError(e.message, null, this); }
        return;
      }
      if (a === '@clear') { this.inp = []; return; }
      if (a === '@del') { this.inp.pop(); return; }
      if (a === '@left' || a === '@right') return;
      if (a[0] !== '@') this.inp.push(a);
      return;
    }
    if (a === '@up') { if (this.r > -1) this.r--; this.clampR(); if (this.r >= 0 && this.r < this.top) this.top = this.r; return; }
    if (a === '@down') { if (this.r < Ls.length) this.r++; this.clampR(); return; }
    if (a === '@left' || a === '@right') {
      this.c = Math.max(0, Math.min(5, this.c + (a === '@left' ? -1 : 1)));
      if (this.c < this.coff) this.coff = this.c; if (this.c > this.coff + 2) this.coff = this.c - 2;
      if (this.r >= 0) this.clampR(); return;
    }
    if (a === '@del') { if (this.r >= 0 && this.r < Ls.length) Ls.splice(this.r, 1); this.clampR(); return; }
    if (a === '@clear') { if (this.r < 0) LISTS[this.name] = []; else this.inp = []; return; }
    if (a === '@enter') { this.inp = this.r < 0 ? [] : this.r < Ls.length ? [...fmt(Ls[this.r])] : []; return; }
    if (a[0] !== '@') this.inp = [a];
  },
  draw(g) {
    const CW = 106, HH = 17, RH = 15, NR = 11;
    g.fillStyle = '#d4d4d4';
    for (let r = 1; r < NR; r++) g.fillRect(0, HH + r * RH, 320, 1);
    for (let k = 0; k < 3; k++) {
      const ci = this.coff + k, name = LNAMES[ci], Ls = LISTS[name], x0 = k * CW + 1, selCol = ci === this.c;
      if (selCol && this.r < 0) { g.fillStyle = '#000'; g.fillRect(x0, 0, CW - 1, HH); }
      stext(g, name, x0 + ((CW - swidth(name)) >> 1), 1, selCol && this.r < 0 ? '#fff' : '#000');
      for (let r = 0; r < NR; r++) {
        const ri = this.top + r, y0 = HH + 1 + r * RH, sel = selCol && ri === this.r;
        if (sel) { g.fillStyle = '#000'; g.fillRect(x0, y0, CW - 2, RH - 1); }
        if (ri < Ls.length) stext(g, fmtShort(Ls[ri], 9), x0 + 3, y0, sel ? '#fff' : '#000');
      }
    }

const matEd = {
  canvas:true, name:'[A]', zone:'grid', dc:0, r:0, c:0, top:0, coff:0, inp:null,
  open(name) {
    const fresh = !MATS[name]; this.name = name; if (fresh) MATS[name] = mNew(1, 1);
    this.zone = fresh ? 'dim' : 'grid'; this.dc = 0; this.r = 0; this.c = 0; this.top = 0; this.coff = 0; this.inp = null; cur = this;
  },
  get m() { return MATS[this.name]; },
  scroll() {
    const vr = CL() ? R - 4 : 11, vc = CL() ? 2 : 4;
    if (this.r < this.top) this.top = this.r; if (this.r > this.top + vr) this.top = this.r - vr;
    if (this.c < this.coff) this.coff = this.c; if (this.c > this.coff + vc) this.coff = this.c - vc;
  },
  next() {                                       // ENTER: on to the next entry, wrapping to the next row
    const m = this.m; if (this.c < m.c - 1) this.c++; else if (this.r < m.r - 1) { this.r++; this.c = 0; }
    this.scroll();
  },
  key(a) {
    const m = this.m;
    if (this.inp !== null) {
      if (a === '@enter') {
        const t = this.inp; this.inp = null;
        if (!t.length) return;
        try {
          const v = evaluate(t).v;
          if (this.zone === 'dim') {
            const n = needNum(v);
            if (this.dc === 0) { resizeMat(this.name, n, m.c); this.dc = 1; } else { resizeMat(this.name, m.r, n); this.zone = 'grid'; this.r = 0; this.c = 0; this.top = 0; this.coff = 0; }
          } else { m.a[this.r][this.c] = needNum(v); this.next(); }
        } catch (e) { isCalcErr(e); showError(e.message, null, this); }
        return;
      }
      if (a === '@clear') { this.inp = []; return; }
      if (a === '@del') { this.inp.pop(); return; }
      if (a[0] === '@') return;
      this.inp.push(a); return;
    }
    if (this.zone === 'dim') {
      if (a === '@left') this.dc = 0; else if (a === '@right') this.dc = 1;
      else if (a === '@down') { this.zone = 'grid'; this.r = 0; this.c = 0; this.scroll(); }
      else if (a === '@enter') { if (this.dc === 0) this.dc = 1; else { this.zone = 'grid'; this.r = 0; this.c = 0; this.scroll(); } }
      else if (a[0] !== '@') this.inp = [a];
      return;
    }
    if (a === '@up') { if (this.r > 0) this.r--; else { this.zone = 'dim'; this.dc = 0; } this.scroll(); return; }
    if (a === '@down') { if (this.r < m.r - 1) this.r++; this.scroll(); return; }
    if (a === '@left') { if (this.c > 0) this.c--; this.scroll(); return; }
    if (a === '@right') { if (this.c < m.c - 1) this.c++; this.scroll(); return; }
    if (a === '@enter') { this.next(); return; }
    if (a === '@clear') { m.a[this.r][this.c] = 0; return; }
    if (a[0] !== '@') this.inp = [a];
  },
  draw(g) {
    const m = this.m, LX = 14, CW = 58, RH = 12, TY = 25, VR = 12, VC = 5;
    /* header: MATRIX[A] 3 ×2   (the size that is being edited is highlighted) */
    const typing = this.inp !== null && this.zone === 'dim', on = this.zone === 'dim';
    const part = (str, x, hl) => { const w = llen(str) * 12; if (hl) { g.fillStyle = '#000'; g.fillRect(x - 1, 1, w + 2, 18); } ltext(g, str, x, 2, hl ? '#fff' : '#000'); return x + w; };
    let hx = 2;
    hx = part('MATRIX' + this.name + ' ', hx, false);
    hx = part(typing && this.dc === 0 ? this.inp.join('') : String(m.r), hx, on && this.dc === 0);
    hx = part(' \uE030', hx, false);
    part(typing && this.dc === 1 ? this.inp.join('') : String(m.c), hx, on && this.dc === 1);
    /* the grid follows the size you are typing (preview only: the matrix itself changes when you press ENTER) */
    let R2 = m.r, C2 = m.c;
    if (typing) { const n = Number(this.inp.join('')); if (Number.isInteger(n) && n >= 1 && n <= 99) { if (this.dc === 0) R2 = n; else C2 = n; } }
    const top = this.zone === 'dim' ? 0 : this.top, coff = this.zone === 'dim' ? 0 : this.coff;
    const cellVal = (i, j) => i < m.r && j < m.c ? m.a[i][j] : 0;
    const nr = Math.min(VR, R2 - top), nc = Math.min(VC, C2 - coff), H = nr * RH, gw = nc * CW;
    g.fillStyle = '#cfcfcf';
    for (let i = 0; i <= nr; i++) g.fillRect(LX, TY + i * RH, gw + 1, 1);
    for (let j = 0; j <= nc; j++) g.fillRect(LX + j * CW, TY, 1, H + 1);
    for (let i = 0; i < nr; i++) for (let j = 0; j < nc; j++) {
      const ri = top + i, ci = coff + j, x0 = LX + j * CW, y0 = TY + i * RH, sel = this.zone === 'grid' && ri === this.r && ci === this.c;
      if (sel) { g.fillStyle = '#000'; g.fillRect(x0 + 1, y0 + 1, CW - 1, RH - 1); }
      stext(g, fmtShort(cellVal(ri, ci), 9), x0 + 8, y0 - 1, sel ? '#fff' : '#000');
    }
    g.fillStyle = '#000';
    const bt = TY - 3, bh = H + 6, lx = LX - 10, rx = LX + gw + 8;
    g.fillRect(lx, bt, 2, bh); g.fillRect(lx, bt, 5, 2); g.fillRect(lx, bt + bh - 2, 5, 2);                    // [
    g.fillRect(rx, bt, 2, bh); g.fillRect(rx - 3, bt, 5, 2); g.fillRect(rx - 3, bt + bh - 2, 5, 2);            // ]
    const tri = (tx, dir) => { for (let k = 0; k < 4; k++) g.fillRect(tx + (dir > 0 ? k : 3 - k), bt + (bh >> 1) - 3 + k, 1, 7 - 2 * k); };
    if (coff > 0) tri(lx - 5, -1); if (coff + nc < C2) tri(rx + 5, 1);
    /* divider and the current entry:  [A](1,1)= 0 */
    const dy = GH - 33; g.fillStyle = '#000'; g.fillRect(0, dy, GW, 2);
    if (this.zone === 'grid') {
      const end = ltext(g, this.name + '(' + (this.r + 1) + ',' + (this.c + 1) + ')=', 2, dy + 5, '#000');      // same size as the header and the value
      if (this.inp !== null) { const e2 = ltext(g, this.inp.join(''), end, dy + 5, '#000'); drawCursorAt(g, { x:Math.min(e2, 308), base:dy + 20, lvl:0 }); }
      else ltext(g, fmt(m.a[this.r][this.c]), end, dy + 5, '#000');
    }
  }
};

/* ================= Dispatcher ================= */
function press(id) {
  S.blink = true;
  highlight(id);
  if (S.off) { if (id === 'on') { S.off = false; paint(); } return; }
  if (id === 'second') { S.second = !S.second; return paint(); }
  if (id === 'alpha') {
    if (S.second) { S.second = false; S.alock = true; S.alpha = true; }
    else if (S.alpha || S.alock) { S.alpha = false; S.alock = false; }
    else S.alpha = true;
    return paint();
  }
  let act;
  if (ARROWS[id]) act = ARROWS[id][S.second ? 1 : 0];
  else {
    const k = K[id];
    if (S.second) act = k.sa === undefined ? k.ma : k.sa;
    else if (S.alpha || S.alock) act = k.aa === undefined ? k.ma : k.aa;
    else act = k.ma;
  }
  S.second = false;
  if (!S.alock) S.alpha = false;
  dispatch(act);
}

function dispatch(act) {
  if (!act) return paint();
  if (act !== '@entry' && act !== '@enter') home.eIdx = -1;
  if (cur === errScr) { errScr.key(act); return paint(); }
  if (cur === stubScr) { setScreen(home); return paint(); }
  const go = s => { leaveCur(); setScreen(s); };
  const menuOpen = name => { leaveCur(); menu.open(name); };
  if (act === '@graph' && cur.f5) cur.f5();                               // soft key above GRAPH (OK / SOLVE)
  else if (act.startsWith('@pop:')) { if (!CL()) popScr.open(+act.slice(5)); }
  else if (act === '@bright+' || act === '@bright-') {
    S.bright = Math.max(.35, Math.min(1.25, S.bright + (act === '@bright+' ? .1 : -.1)));
    $('lcd').style.filter = `brightness(${S.bright})`;
  }
  else if (act === '@quit') go(home);
  else if (act === '@mode') go(cur === modeScr ? home : modeScr);
  else if (act === '@off') { S.off = true; }
  else if (act === '@on') { /* ON acts as "break": nothing to interrupt */ }
  else if (act === '@yeq') go(yeqScr);
  else if (act === '@window') go(winScr);
  else if (act === '@tblset') go(tblsetScr);
  else if (act === '@graph') { leaveCur(); graphScr.reset(); setScreen(graphScr); }
  else if (act === '@trace') { leaveCur(); setScreen(graphScr); graphScr.startTrace(); }
  else if (act === '@table') go(tableScr);
  else if (act === '@solve') { if (cur === solverScr) cur.key(act); else go(solverScr); }
  else if (act === '@zoom') menuOpen('ZOOM');
  else if (act === '@catalog') menuOpen('CATALOG');
  else if (act.startsWith('@menu:')) menuOpen(act.slice(6));
  else if (act.startsWith('@stub:')) { stubScr.title = act.slice(6); go(stubScr); }
  else {
    if ((act === 'n/d' || act === 'Un/d') && !(cur === home || cur === yeqScr || (cur === solverScr && solverScr.state === 'eq'))) act = act === 'n/d' ? '÷' : '';
    if (act) cur.key(act);
  }
  paint();
}

/* TI-84 Plus screen: monochrome — everything is reduced to dark ink on a grey-green LCD */
function mono() {
  const id = g.getImageData(0, 0, 640, 480), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    let t = ((0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) - 110) / 80; t = t < 0 ? 0 : t > 1 ? 1 : t;
    d[i] = 22 + t * 143; d[i + 1] = 26 + t * 148; d[i + 2] = 18 + t * 134;
  }
  g.putImageData(id, 0, 0);
}

/* ================= TI-84 Plus (classic OS) =================

PADS['84'] = pad84Svg();

function applyModel(m) {
  const was = MODEL; MODEL = m; const calc = $('calc'), is84 = m === '84', H = CALC_H[m];
  if (was !== m) {                                            // the two calculators have different screens: swap the text grid, graph size and entry mode
    if (is84) { SETMP_CE = SET.mp; SET.mp = false; W = 16; R = 8; PW = 94; PH = 62; }
    else { SET.mp = SETMP_CE; W = 26; R = 10; PW = 265; PH = 165; }
    lcd.width = is84 ? 576 : 640; lcd.height = is84 ? 384 : 480; g = lcd.getContext('2d');
    if (is84) flatten84();
    S.second = S.alpha = S.alock = S.ins = false;
    if (typeof cur !== 'undefined' && cur) { leaveCur(); setScreen(home); }
    [['yequ', '@pop:0'], ['window', '@pop:1'], ['zoom', '@pop:2'], ['trace', '@pop:3'], ['graph', '@graph']].forEach(([id, a]) => { K[id].aa = is84 ? '' : a; });
  }
  calc.classList.toggle('m84', is84); calc.style.height = H + 'px'; $('body').style.height = H + 'px';
  if (is84 && !hw84.firstChild) hw84.innerHTML = hw84Svg();
  ttl.querySelector('.tx').innerHTML = is84 ? 'TI-84 <span>Plus</span>' : 'TI-84 <span>Plus CE</span>';
  ttl.style.top = is84 ? '25px' : ttl._ce.t;
  for (const [id] of KEYDEFS) {
    const b = $('k-' + id);
    if (is84) { const [x, y, w, h] = GEO84[id]; b.style.left = r1(cx84(x)) + 'px'; b.style.top = r1(cy84(y)) + 'px'; b.style.width = r1(w * S84) + 'px'; b.style.height = r1(h * S84) + 'px'; }
    else { const c = b._ce; b.style.left = c.l; b.style.top = c.t; b.style.width = c.w; b.style.height = c.h; }
  }
  for (const e of document.querySelectorAll('.lb[data-k]')) {
    e.classList.toggle('oncover', ['yequ', 'window', 'zoom', 'trace', 'graph'].includes(e.dataset.k));
    if (is84) { const [x, y, w] = GEO84[e.dataset.k]; e.style.left = r1(cx84(x + w / 2)) + 'px'; e.style.minWidth = '0px'; e.style.top = r1(cy84(y) - 17) + 'px'; }
    else { e.style.left = e._ce.l; e.style.minWidth = e._ce.w; e.style.top = e._ce.t; }
  }
  K.xt.aa = is84 ? '' : 'n/d';                        // the fraction shortcut is a CE feature
  const pad = $('dpad'); pad.innerHTML = PADS[m]; PADS.bind();
  if (is84) { pad.style.left = r1(cx84(570)) + 'px'; pad.style.top = r1(cy84(850) + 34 * S84) + 'px'; }
  else { pad.style.left = pad._ce.l; pad.style.top = pad._ce.t; }
  lcd.style.left = lcdfx.style.left = (is84 ? LCD84.l + 'px' : lcd._ce.l);
  lcd.style.top = lcdfx.style.top = (is84 ? LCD84.t + 'px' : lcd._ce.t);
  const sh = $('shots'); sh.style.left = is84 ? r1(cx84(160)) + 'px' : ''; sh.style.top = is84 ? r1(cy84(1880)) + 'px' : '';
  try { localStorage.setItem('ti-model', m); } catch (e) {}
}
let swapping = false, SETMP_CE = true;
function switchModel() {
  if (swapping) return; swapping = true;
  const st = $('stage'); st.classList.add('swap');
  setTimeout(() => {
    applyModel(MODEL === 'ce' ? '84' : 'ce'); fit(); paint();
    requestAnimationFrame(() => requestAnimationFrame(() => { st.classList.remove('swap'); setTimeout(() => { swapping = false; }, 150); }));
  }, 140);
}
ttl.firstChild.addEventListener('click', switchModel);
let saved = 'ce'; try { saved = localStorage.getItem('ti-model') || 'ce'; } catch (e) {}
applyModel(saved === '84' ? '84' : 'ce');

/* ================= Physical keyboard ================= */
const KB = { '+':'add','-':'sub','*':'mul','/':'div','^':'pow','(':'lp',')':'rp',',':'comma','.':'dot',
  Enter:'enter',Delete:'del',Escape:'clear',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right' };
function flash(id) { const k = $('k-' + id); if (k) { k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 110); } }
/* Backspace deletes while there is something to delete, otherwise it acts as CLEAR (clears the screen / leaves a menu) */
function backspaceId() {
  const edEmpty = ed => !ed.root.length;
  if (cur === home) return edEmpty(home.ed) ? 'clear' : 'del';
  if (cur === yeqScr) return edEmpty(YE[yeqScr.sel]) ? 'clear' : 'del';
  if (cur === solverScr && solverScr.state === 'eq') return 'del';
  if (cur === graphScr) return graphScr.inp !== null && graphScr.inp.length ? 'del' : 'clear';
  if (cur === tableScr) return tableScr.inp !== null && tableScr.inp.length ? 'del' : 'clear';
  if (cur === matEd) return matEd.inp !== null && matEd.inp.length ? 'del' : 'clear';
  if (cur === listEd) return listEd.inp !== null && !listEd.inp.length ? 'clear' : 'del';
  if (cur === winScr || cur === tblsetScr || cur === solverScr || cur === wizScr || cur === statWiz) return 'del';
  return 'clear';
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === '`') { e.preventDefault(); copyShot(); return; }
  let id = /^[0-9]$/.test(e.key) ? e.key : KB[e.key];
  if (e.key === 'Backspace') id = backspaceId();
  if (e.key === '~' || e.key === '_') id = 'neg';
  if (id) { e.preventDefault(); flash(id); press(id); return; }
  if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); S.second = false; if (!S.alock) S.alpha = false; dispatch(e.key.toUpperCase()); }
  else if (e.key === '!') { e.preventDefault(); dispatch('!'); }
});

/* ================= Key highlight (visible on screen share) ================= */
function highlight(id) {
  const el = $('k-' + id); if (!el) return;
  el.classList.remove('hl'); void el.getBoundingClientRect(); el.classList.add('hl');
  clearTimeout(el._hl); el._hl = setTimeout(() => el.classList.remove('hl'), el.tagName === 'BUTTON' ? 950 : 220);   // keys fade out via CSS; d-pad petals hold briefly, then fade
}
function armKeys() {
  $('k-second').classList.toggle('armed', S.second);
  $('k-alpha').classList.toggle('armed', S.alpha || S.alock);
}

/* ================= Screenshot of the LCD ================= */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800);
}
/* the whole 320×240 screen (status bar included, cursor visible) scaled 3× with hard pixel edges */
function shotCanvas() {
  const keep = S.blink; S.blink = true; paint();
  const c = document.createElement('canvas'); c.width = lcd.width * 1.5; c.height = lcd.height * 1.5;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(lcd, 0, 0, c.width, c.height);
  S.blink = keep; paint();
  return c;
}
const shotBlob = () => new Promise(res => shotCanvas().toBlob(res, 'image/png'));
const shotName = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `ti84-screen-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`; };
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyShot() {
  try {
    if (!navigator.clipboard || !window.ClipboardItem) throw new Error('no clipboard');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': shotBlob() })]);   // promise form keeps Safari's user-gesture rule happy
    toast('Screenshot copied — paste it anywhere');
  } catch (e) {
    try { downloadBlob(await shotBlob(), shotName()); toast('Clipboard not available — saved as an image instead'); } catch (e2) { toast('Could not take screenshot'); }
  }
}
$('shotCopy').onclick = copyShot;

/* ================= Boot ================= */
/* scale the whole calculator to the visible area (iPad Safari: visualViewport excludes the toolbars) and centre it */
function fit() {
  const c = $('calc'), vv = window.visualViewport;
  if (vv && Math.abs(vv.scale - 1) > 0.01) return;   // pinch-zoomed: the visual viewport shrinks and pans, so refitting would push the calculator off screen; leave the layout alone until zoom returns to 1
  const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight, pad = 8;
  const ch = CALC_H[MODEL];
  const s = Math.min((vw - 2 * pad) / 438, (vh - 2 * pad) / ch);
  const x = (vw - 438 * s) / 2, y = (vh - ch * s) / 2;
  c.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('scroll', () => { if (Math.abs(visualViewport.scale - 1) <= 0.01) fit(); });
/* browsers (notably iPad Safari) can drop a canvas's pixels while in the background: redraw when it comes back */
lcd.addEventListener('contextrestored', () => paint());
document.addEventListener('visibilitychange', () => { if (!document.hidden) paint(); });
addEventListener('pageshow', () => paint());
setScreen(home);
fit(); paint();
setInterval(() => { S.blink = !S.blink; if (!S.off) paint(); }, 500);
</script>
